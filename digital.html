inmal pro Woche in die Anzeigen, und wenn ich etwas brauche, warte ich auch mal zwei Monate.\n\nKleidung kaufe ich dagegen gern gebraucht. Man findet Sachen, die es neu längst nicht mehr gibt – und nach dem Waschen ist alles wie neu. Für mich ist das kein Verzicht, sondern ein Vergnügen."},"typicalErrors":"Miriams Beitrag nur zusammenfassen, statt eine eigene Meinung zu schreiben · keine Beispiele · deutlich unter 80 Wörtern."},{"no":3,"minutes":15,"words":40,"situation":["Ihr Internetanschluss funktioniert seit Tagen nicht. Ein Techniker der Firma NetOne möchte am Dienstagvormittag kommen. Zu dieser Zeit sind Sie bei der Arbeit."],"points":[],"post":null,"instruction":"Schreiben Sie an Herrn Kaiser von der Firma NetOne. Erklären Sie höflich, warum der Termin nicht passt, und schlagen Sie einen anderen vor. Schreiben Sie eine E-Mail (circa 40 Wörter). Vergessen Sie nicht die Anrede und den Gruß am Schluss.","model":{"label":"E-Mail an eine Firma, ca. 45 Wörter","text":"Sehr geehrter Herr Kaiser,\n\nam Dienstagvormittag bin ich leider nicht zu Hause, weil ich bis 17 Uhr arbeiten muss. Wäre ein Termin am Donnerstag nach 17 Uhr oder am Samstagvormittag möglich? Bitte teilen Sie mir kurz mit, was Ihnen passt.\n\nMit freundlichen Grüßen\nNora Baumann"},"typicalErrors":"Terminvorschlag fehlt · Hallo Herr Kaiser oder Liebe Grüße in einer Firmenmail · Grund für die Absage nicht genannt."}]},"audio":[{"src":"Goethe%20B1%20Modelltest%202.1.mp3","dur":408.16},{"src":"Goethe%20B1%20Modelltest%202.2.mp3","dur":207.73},{"src":"Goethe%20B1%20Modelltest%202.3.mp3","dur":202.55},{"src":"Goethe%20B1%20Modelltest%202.4.mp3","dur":578.3}],"pdf":"Goethe%20B1%20Modelltest%202.pdf","pages":{"loesung":17,"muster":18,"kommentar":20,"hoertexte":22}},"3":{"id":3,"roman":"III","lesen":{"t1":{"instruction":"Lesen Sie den Text und die Aufgaben 1 bis 6 dazu. Wählen Sie: Sind die Aussagen Richtig oder Falsch?","blog":{"site":"merle-schreibt.de · Merle","date":"Sonntag, 2. Juni","title":"Drei Tage ohne Bruno","paragraphs":["Bruno ist wieder da – und ich kann endlich wieder schlafen. Aber von Anfang an: Am Donnerstagabend zog ein Gewitter über die Stadt, und unser Hund hat vor nichts so viel Angst wie vor Donner. Ich war noch im Büro, mein Mann hatte gerade die Balkontür geöffnet, um zu lüften. Ein Blitz, ein Knall – und Bruno war weg. Über den Balkon im Erdgeschoss, durch den Garten, auf die Straße. Als ich um sieben nach Hause kam, suchte Tom schon seit einer Stunde.","Die erste Nacht sind wir bis zwei Uhr durch die Straßen gelaufen und haben seinen Namen gerufen. Nichts. Ein Mann mit einer Taschenlampe hat uns geholfen, den Park abzusuchen – ebenfalls ohne Erfolg. Am Freitagmorgen habe ich im Büro angerufen und mir freigenommen – meine Chefin hat keine Sekunde gezögert. Dann haben wir Zettel gedruckt, hundert Stück, mit Foto und Telefonnummer. Tom wollte sie an jeden Laternenpfahl kleben; das ist bei uns allerdings verboten, also haben wir sie in Geschäften, in der Bäckerei und beim Tierarzt ausgelegt. Die Bäckerin hat sogar einen ins Schaufenster gehängt.","Geholfen hat am Ende etwas anderes. Unsere Nachbarin Frau Yildiz, die ich bis dahin nur vom Grüßen kannte, hat Brunos Foto in die Nachbarschaftsgruppe im Internet gestellt. Innerhalb eines Tages hatten es über dreihundert Leute gesehen. Zwei Anrufe waren falscher Alarm: einmal ein schwarzer Labrador, einmal ein Hund, der Bruno nur entfernt ähnlich sah. Am Samstagnachmittag rief eine Frau aus dem Nachbarstadtteil an: Ein Hund, der genauso aussehe, sitze seit Freitag im Tierheim. Zwanzig Minuten später standen wir dort – und Bruno sprang uns an, als wäre nichts gewesen. Ein Radfahrer hatte ihn am Freitagmorgen am Kanal gefunden und abgegeben.","Das Tierheim hätte uns übrigens sofort anrufen können, wenn Bruno einen Chip gehabt hätte. Den bekommt er jetzt nächste Woche – der Tierarzt sagt, das dauert keine fünf Minuten. Und Frau Yildiz bekommt am Sonntag einen Kuchen. Sie sagt, das sei nicht nötig. Ich finde schon – und ich habe gelernt, dass man seine Nachbarn kennen sollte, bevor man sie braucht."],"closing":"Bis bald, Merle"},"example":{"no":"0","text":"Merles Hund ist weggelaufen.","answer":"R"},"items":[{"no":"1","text":"Bruno ist verschwunden, während Merle bei der Arbeit war.","answer":"R"},{"no":"2","text":"Merle musste am Freitag trotzdem ins Büro gehen.","answer":"F"},{"no":"3","text":"Merle und Tom haben die Zettel an Straßenlaternen befestigt.","answer":"F"},{"no":"4","text":"Merle kannte Frau Yildiz vorher kaum.","answer":"R"},{"no":"5","text":"Ein Radfahrer hat Merle angerufen.","answer":"F"},{"no":"6","text":"Bruno hatte bis jetzt keinen Chip.","answer":"R"}]},"t2":{"texts":[{"instruction":"Lesen Sie den Text aus der Presse und die Aufgaben 7 bis 9 dazu. Wählen Sie bei jeder Aufgabe die richtige Lösung a, b oder c.","title":"Warten auf den Nachbarn","lead":"In Hollen ersetzt eine Bank den Bus – wer sich hinsetzt, möchte mitgenommen werden.","paragraphs":["Am Ortsausgang von Hollen steht seit dem Frühjahr eine grüne Holzbank mit drei Schildern: „Kreisstadt“, „Bahnhof“, „Schwimmbad“. Wer sich darauf setzt und ein Schild hochklappt, wartet nicht auf den Bus – der kommt in Hollen nur noch zweimal am Tag –, sondern auf einen Nachbarn mit Auto. „Die meisten fahren sowieso in die Stadt, mit leeren Sitzen“, sagt Ortsvorsteherin Gudrun Peters, die diese Idee aus einem Dorf im Schwarzwald mitgebracht hat. Die Bank hat der Schreiner im Ort gebaut, die Schilder haben Schüler bemalt; gekostet hat das Ganze 400 Euro, bezahlt aus der Dorfkasse. Regeln gibt es kaum: Niemand muss anhalten, niemand muss einsteigen, und Geld wird nicht verlangt. Wie oft die Bank genutzt wird, weiß Peters nicht genau – eine Zählung gibt es nicht. Sie schätzt, dass an schönen Tagen etwa zehn Personen mitgenommen werden, im Winter deutlich weniger. Sicher ist, dass man selten länger als zehn Minuten wartet; das haben Jugendliche in den Sommerferien ausprobiert. Kritik kam von der Polizei, die vor dem Einsteigen bei Fremden warnte. Peters hält dagegen: „Hier kennt jeder jeden. Wer mich mitnimmt, ist kein Fremder, sondern der Mann von der Post oder die Frau aus dem Chor.“ Für den Winter plant der Ort ein Dach über der Bank. Eine zweite Bank soll in der Kreisstadt stehen – für die Rückfahrt."],"footnote":"","source":"aus einer deutschen Zeitung","example":{"no":"0","stem":"Die Bank in Hollen …","options":{"a":"ist eine Haltestelle für den Bus.","b":"ist ein Treffpunkt für Mitfahrer.","c":"wurde von der Polizei aufgestellt."},"answer":"b"},"items":[{"no":"7","stem":"In diesem Text geht es um …","options":{"a":"einen Bus, der nur zweimal täglich fährt.","b":"Schüler, die für ihr Dorf eine Bank gebaut haben.","c":"Nachbarn, die einander im Auto mitnehmen."},"answer":"c"},{"no":"8","stem":"Wer auf der Bank sitzt, …","options":{"a":"zahlt dem Fahrer einen kleinen Betrag.","b":"wartet meistens nur kurz.","c":"muss in das erste Auto einsteigen."},"answer":"b"},{"no":"9","stem":"Gudrun Peters …","options":{"a":"findet die Warnung der Polizei berechtigt.","b":"möchte die Bank im nächsten Winter abbauen.","c":"vertraut den Fahrern aus dem eigenen Dorf."},"answer":"c"}]},{"instruction":"Lesen Sie den Text aus der Presse und die Aufgaben 10 bis 12 dazu. Wählen Sie bei jeder Aufgabe die richtige Lösung a, b oder c.","title":"Zweites Leben für alte Velos*","lead":"In Brugg machen Jugendliche aus vergessenen Fahrrädern Leihräder für alle.","paragraphs":["Rund 150 Fahrräder bleiben jedes Jahr am Bahnhof von Brugg stehen und werden nie mehr abgeholt. Früher landeten sie nach drei Monaten beim Alteisen. Seit zwei Jahren holt sie die Jugendwerkstatt „Kette“ ab. Dort reparieren zwölf Jugendliche zwischen 15 und 18 Jahren die Räder an zwei Nachmittagen pro Woche – unter Anleitung eines pensionierten Mechanikers. „Die meisten haben vorher noch nie einen Schlauch gewechselt“, sagt Werkstattleiterin Nadia Roth. Zuerst lernen sie, Bremsen und Licht zu prüfen; wer das beherrscht, darf sich an die Gangschaltung wagen. Was wieder fährt, wird nicht verkauft, sondern verliehen: Am Bahnhof stehen zwanzig gelbe Räder, die man mit einem Ausweis kostenlos für einen Tag nehmen kann. Bezahlt wird nur, wenn ein Rad zu spät zurückkommt – fünf Franken pro Tag. Wer ein Rad beschädigt zurückbringt, bezahlt die Reparatur. Von diesem Geld und einem Beitrag der Stadt lebt die Werkstatt; Löhne gibt es nicht, die Jugendlichen arbeiten freiwillig. Dafür bekommen sie am Ende des Jahres ein Zeugnis, das bei der Lehrstellensuche hilft. Drei von ihnen haben inzwischen eine Lehre als Velomechaniker begonnen. Nicht alles läuft rund: Im ersten Sommer kamen vier Räder gar nicht zurück, und im Winter nutzt kaum jemand das Angebot. Roth denkt deshalb über eine Pause von Dezember bis Februar nach. Aufhören will sie nicht: „Wir haben eine Warteliste von zwanzig Jugendlichen, die mitmachen möchten.“"],"footnote":"*Velo = Schweizer Standard für „Fahrrad“","source":"aus einer Schweizer Zeitung","example":null,"items":[{"no":"10","stem":"In diesem Text geht es um …","options":{"a":"Leihräder, die Jugendliche aus alten Rädern bauen.","b":"einen Bahnhof, an dem alte Fahrräder verkauft werden.","c":"einen Mechaniker, der eine Lehre in seiner Werkstatt anbietet."},"answer":"a"},{"no":"11","stem":"Die Jugendlichen …","options":{"a":"arbeiten zweimal in der Woche in der Werkstatt.","b":"verdienen mit der Arbeit etwas Geld.","c":"kennen sich schon vorher gut mit Fahrrädern aus."},"answer":"a"},{"no":"12","stem":"Nadia Roth überlegt, …","options":{"a":"die Werkstatt aus Geldmangel zu schließen.","b":"die reparierten Räder künftig zu verkaufen.","c":"das Angebot im Winter zu unterbrechen."},"answer":"c"}]}]},"t3":{"instruction":"Lesen Sie die Situationen 13 bis 19 und die Anzeigen a bis j aus verschiedenen deutschsprachigen Medien. Wählen Sie: Welche Anzeige passt zu welcher Situation? Sie können jede Anzeige nur einmal verwenden. Die Anzeige aus dem Beispiel können Sie nicht mehr verwenden. Für eine Situation gibt es keine passende Anzeige. In diesem Fall schreiben Sie 0.","context":"Einige Ihrer Nachbarinnen und Nachbarn brauchen Hilfe im Alltag und suchen passende Angebote.","example":{"no":"0","text":"Frau Lenz fliegt drei Wochen in den Urlaub und sucht jemanden, der sich in dieser Zeit um ihre Katze kümmert.","answer":"b"},"items":[{"no":"13","text":"Herr Blum wechselt am Sonntag die Wohnung und braucht zwei starke Leute, die ihm beim Tragen helfen.","answer":"a"},{"no":"14","text":"Die Tochter von Familie Koch (7. Klasse) braucht Hilfe in Mathe. Die Eltern möchten, dass sie dafür nicht aus dem Haus muss.","answer":"e"},{"no":"15","text":"Frau Ahmed arbeitet Vollzeit und hat für den Haushalt keine Zeit mehr. Sie ist erst abends zu Hause.","answer":"f"},{"no":"16","text":"Herr Petrov steht am Sonntagabend vor seiner Wohnungstür – der Schlüssel liegt in der Wohnung.","answer":"c"},{"no":"17","text":"Frau Weber, 78, hat einen neuen Computer bekommen und möchte, dass ihr jemand in Ruhe erklärt, wie er funktioniert.","answer":"j"},{"no":"18","text":"Herr Costa hat morgen früh ein Vorstellungsgespräch. Sein Anzug muss bis dahin gereinigt sein.","answer":"0"},{"no":"19","text":"Die Waschmaschine von Herrn Sato ist kaputt. Wegwerfen möchte er sie aber nicht.","answer":"d"}],"ads":[{"letter":"a","header":"Studenten packen an","tag":"UMZUGSHILFE","title":"Umzug am Wochenende?","subtitle":"","facts":[],"body":["Zwei bis vier kräftige junge Leute tragen, schleppen und fahren für Sie – auch am Wochenende. Transporter auf Wunsch, Abrechnung pro Stunde und Person. Meist schon innerhalb von zwei Tagen buchbar."],"footer":"studenten-packen-an.de · 0421 / 70 70 70"},{"letter":"b","header":"Pfötchen · Tierbetreuung","tag":"","title":"","subtitle":"Ihr Tier bleibt zu Hause","facts":[],"body":["Wir kommen ein- oder zweimal täglich zu Ihnen, füttern, spielen und reinigen die Katzentoilette – und gießen nebenbei die Blumen. Vorgespräch kostenlos, auch kurzfristig vor dem Urlaub."],"footer":"pfoetchen-tierbetreuung.de · 0421 / 51 51 51"},{"letter":"c","header":"Schlüsselnotdienst Ruf","tag":"24 STUNDEN · 7 TAGE","title":"","subtitle":"","facts":[],"body":["Ausgesperrt? Wir sind rund um die Uhr für Sie da, auch an Sonn- und Feiertagen. In der Regel sind wir innerhalb von 30 Minuten bei Ihnen, öffnen die Tür ohne Schaden am Schloss und nennen Ihnen den Festpreis vorher am Telefon."],"footer":"0421 / 11 22 00 · schluesselnotdienst-ruf.de"},{"letter":"d","header":"Elektro Hansen","tag":"","title":"Reparatur statt Neukauf.","subtitle":"","facts":[],"body":["Waschmaschine, Trockner, Geschirrspüler oder Herd – wir reparieren alle Marken bei Ihnen zu Hause. Kostenvoranschlag vor Ort, Ersatzteile meist auf Lager. Computer und Telefone reparieren wir nicht."],"footer":"Tel. 0421 / 65 43 21 · Termine auch abends"},{"letter":"e","header":"Lernen mit Lena","tag":"","title":"Einzelunterricht bei Ihnen zu Hause","subtitle":"","facts":[],"body":["Unsere Studentinnen und Studenten unterrichten in Ihrer Wohnung – am Küchentisch, ohne Zeitdruck. Alle Hauptfächer, Klasse 5 bis 10. Termine nach Absprache, auch am Wochenende. Die erste Stunde ist kostenlos."],"footer":"lernen-mit-lena.de · 0421 / 88 77 66"},{"letter":"f","header":"Blitzblank Reinigungsservice","tag":"","title":"Sauber, während Sie arbeiten","subtitle":"","facts":[],"body":["Wir kümmern uns um Ihre Wohnung, wenn Sie nicht da sind: Schlüsselübergabe nach Vereinbarung, immer dieselbe Ansprechpartnerin, wöchentlich oder alle zwei Wochen. Versichert und zuverlässig – fragen Sie Ihre Nachbarn."],"footer":"Angebot unter 0421 / 33 44 55"},{"letter":"g","header":"LERNSTUDIO ZENTRUM","tag":"","title":"Förderung in kleinen Gruppen","subtitle":"","facts":[],"body":["Drei bis fünf Schülerinnen und Schüler üben gemeinsam in unseren Räumen am Marktplatz, Montag bis Freitag von 14 bis 18 Uhr. Alle Fächer, alle Klassen. Hausbesuche bieten wir nicht an. Probewoche 20 €."],"footer":"lernstudio-zentrum.de"},{"letter":"h","header":"SCHUH & SCHLÜSSEL BAR","tag":"SOFORTSERVICE IM BAHNHOF","title":"","subtitle":"","facts":[],"body":["Absätze, Sohlen, Reißverschlüsse – und Schlüsselkopien in fünf Minuten, auch Sicherheitsschlüssel mit Karte. Montag bis Samstag 9 bis 18 Uhr. Türen öffnen wir nicht, dafür rufen Sie bitte einen Notdienst."],"footer":"Direkt am Ausgang Süd"},{"letter":"i","header":"TEXTILPFLEGE WEISS · REINIGUNG UND ÄNDERUNGEN","tag":"","title":"","subtitle":"","facts":[],"body":["Hemden und Blusen am selben Tag: morgens abgegeben, abends fertig. Anzüge, Kleider und Mäntel brauchen drei Werktage. Änderungen und kleine Reparaturen erledigt unsere Schneiderin im Haus."],"footer":"Bahnhofstraße 4 · Mo–Fr 8–18 Uhr, Sa 9–13 Uhr"},{"letter":"j","header":"Digital-Lotsen 60+","tag":"","title":"","subtitle":"","facts":[],"body":["Wir kommen zu Ihnen nach Hause und erklären Laptop, Tablet und Handy Schritt für Schritt – so lange, bis alles sitzt. Geduldige Helferinnen und Helfer, keine Fachsprache. Erster Termin 15 €. Reparaturen führen wir nicht durch."],"footer":"digital-lotsen.de · 0421 / 24 24 24"}]},"t4":{"instruction":"Lesen Sie die Texte 20 bis 26. Wählen Sie: Ist die Person für eine autofreie Innenstadt, Ja oder Nein?","context":"In einer Zeitschrift lesen Sie Kommentare zu einem Artikel über Städte, die keine privaten Autos mehr in ihr Zentrum lassen.","header":"LESERKOMMENTARE","site":"www.stadtleben-magazin.de/forum","example":{"no":"0","name":"Beate","byline":"Beate, 52, Münster","text":"Seit unsere Altstadt frei von Autos ist, sitze ich abends draußen und höre die Brunnen statt der Motoren. Die Läden sind voller als vorher, nicht leerer – die Leute bleiben länger, wenn sie nicht auf die Parkuhr schauen müssen. Wer das einmal erlebt hat, will nicht mehr zurück.","answer":"J"},"items":[{"no":"20","name":"Dirk","byline":"Dirk, 44, Kassel","text":"Ich verstehe ja, dass sich viele eine ruhige Innenstadt wünschen. Aber ich beliefere dort drei Restaurants, jeden Morgen, mit dem Wagen voll Gemüse. Vor sechs Uhr zu liefern, wie es die Stadt vorschlägt, geht nicht – da sind die Küchen noch geschlossen. Mit dem Lastenrad schaffe ich das nicht, und ein Verbot trifft Leute wie mich, nicht die Sonntagsfahrer.","answer":"N"},{"no":"21","name":"Nadine","byline":"Nadine, 31, Graz","text":"Bei uns war die Innenstadt an einem Sonntag im Herbst zum ersten Mal gesperrt. Meine Kinder sind mitten auf der Hauptstraße Roller gefahren, und ich habe zum ersten Mal die Fassaden angeschaut. Sogar die Wirte haben ihre Tische auf die Straße gestellt. Am Montag habe ich im Rathaus die Liste für eine dauerhafte Sperrung unterschrieben.","answer":"J"},{"no":"22","name":"Halil","byline":"Halil, 38, Bochum","text":"Erst muss der Bus alle zehn Minuten fahren, auch abends, auch am Wochenende. Ich wohne zwanzig Kilometer außerhalb, und nach 20 Uhr fährt dort gar nichts mehr. Dann kann man über eine Sperrung reden. Umgekehrt geht es nicht: Wer heute die Autos aussperrt, sperrt die Leute aus den Vororten aus. Bis dahin: nein.","answer":"N"},{"no":"23","name":"Ruth","byline":"Ruth, 67, Freiburg","text":"Als das hier beschlossen wurde, habe ich einen wütenden Brief an die Zeitung geschrieben. Wie soll ich mit 67 die Einkäufe schleppen? Heute fährt ein kleiner Elektrobus alle acht Minuten durch die Altstadt; ich komme näher an die Läden als früher mit dem Auto, und die Fahrt kostet mich nichts. Den Brief würde ich heute nicht mehr schreiben.","answer":"J"},{"no":"24","name":"Sven","byline":"Sven, 49, Hannover","text":"Meine Kunden kommen aus dem ganzen Umland und tragen große Kartons hinaus – ich verkaufe Lampen. Für so etwas nimmt niemand die Straßenbahn, das sagen mir meine Kunden jede Woche – und die Parkhäuser am Stadtrand sind ihnen zu weit weg. Ein Geschäft wie meins lebt vom Parkplatz vor der Tür. Nehmt ihn weg, und ich bin in einem Jahr weg.","answer":"N"},{"no":"25","name":"Anja","byline":"Anja, 35, Wien","text":"Für mich hängt alles von den Parkhäusern am Stadtrand ab: Wenn sie günstig sind und ein Bus von dort ins Zentrum fährt, dann sofort. Ohne diese Lösung wäre ich dagegen, denn ich wohne selbst im Umland. Genau so macht es meine Stadt gerade – ich habe schon die Jahreskarte fürs Parkhaus gekauft und freue mich auf den ersten Sommer ohne Blechlawine.","answer":"J"},{"no":"26","name":"Georg","byline":"Georg, 73, Lübeck","text":"Eine schöne Idee, wirklich. Ich habe früher selbst gern in autofreien Orten Urlaub gemacht. Nur laufe ich seit meiner Hüftoperation kaum noch zweihundert Meter, und ein Taxi bis vor die Apotheke ist für mich keine Bequemlichkeit, sondern Notwendigkeit. Und ich bin nicht der Einzige in meiner Straße, dem es so geht. Für Leute wie mich muss das Zentrum mit dem Auto erreichbar bleiben.","answer":"N"}]},"t5":{"instruction":"Lesen Sie die Aufgaben 27 bis 30 und den Text dazu. Wählen Sie bei jeder Aufgabe die richtige Lösung a, b oder c.","context":"Sie haben sich einen Ausweis der Stadtbibliothek ausstellen lassen und lesen die Benutzungsordnung.","doc":{"title":"BENUTZUNGSORDNUNG · STADTBIBLIOTHEK","intro":"","sections":[{"heading":"Ausweis","text":"Der Bibliotheksausweis wird gegen Vorlage eines Personalausweises ausgestellt und ist ein Jahr gültig. Er kostet für Erwachsene 20 Euro, für Studierende und Auszubildende 10 Euro; Kinder und Jugendliche bis 18 Jahre erhalten ihn kostenlos. Der Ausweis ist nicht übertragbar. Ein Verlust ist umgehend zu melden; für die Ersatzkarte werden 5 Euro berechnet."},{"heading":"Ausleihe","text":"Bücher und Zeitschriften können vier Wochen, Filme und Spiele zwei Wochen ausgeliehen werden. Eine Verlängerung um jeweils vier Wochen ist zweimal möglich – online, telefonisch oder am Schalter –, sofern das Medium nicht von einer anderen Person vorbestellt wurde. Die aktuelle Ausgabe einer Zeitschrift kann nur im Lesesaal genutzt werden. Pro Ausweis dürfen höchstens 20 Medien gleichzeitig ausgeliehen sein."},{"heading":"Rückgabe und Gebühren","text":"Medien können zu den Öffnungszeiten am Schalter oder jederzeit über die Rückgabebox neben dem Eingang zurückgegeben werden. Bei verspäteter Rückgabe fällt pro Medium und angefangener Woche 1 Euro an; für Kinderausweise wird die Hälfte berechnet. Beschädigte oder verlorene Medien sind zu ersetzen."},{"heading":"Arbeitsplätze und Technik","text":"Die Lese- und Arbeitsplätze im ersten Stock stehen allen Besucherinnen und Besuchern offen, auch ohne Ausweis. Die Computerarbeitsplätze können mit Ausweis für zwei Stunden pro Tag reserviert werden. WLAN ist kostenlos, das Passwort erhalten Sie an der Information. Drucken und Kopieren kosten 10 Cent pro Seite."},{"heading":"Verhalten","text":"In den Lesesälen ist Ruhe zu wahren; Telefongespräche sind nur im Foyer gestattet. Getränke in verschließbaren Flaschen sind erlaubt, Speisen nicht. Taschen und Jacken können in den Schließfächern im Eingangsbereich abgelegt werden; die Bibliothek haftet nicht für mitgebrachte Gegenstände."}],"footer":""},"example":null,"items":[{"no":"27","stem":"Wer seinen Ausweis verliert, …","options":{"a":"bekommt kostenlos einen neuen.","b":"bekommt gegen Bezahlung eine neue Karte.","c":"muss einen neuen Ausweis für 20 Euro kaufen."},"answer":"b"},{"no":"28","stem":"Ein Buch …","options":{"a":"darf man nur ein einziges Mal verlängern.","b":"kann man ausschließlich am Schalter verlängern.","c":"kann man bis zu zwölf Wochen behalten."},"answer":"c"},{"no":"29","stem":"Wer ein Buch zu spät zurückgibt, …","options":{"a":"muss das Buch durch ein neues ersetzen.","b":"zahlt mit einem Kinderausweis weniger.","c":"darf vorerst nichts mehr ausleihen."},"answer":"b"},{"no":"30","stem":"Wer keinen Bibliotheksausweis hat, …","options":{"a":"kann im ersten Stock lesen und arbeiten.","b":"kann einen Computerplatz für zwei Stunden reservieren.","c":"darf die Bibliothek nicht betreten."},"answer":"a"}]}},"hoeren":{"t1":{"instruction":"Sie hören nun fünf kurze Texte. Sie hören jeden Text zweimal. Zu jedem Text lösen Sie zwei Aufgaben. Wählen Sie bei jeder Aufgabe die richtige Lösung.","readNote":"Lesen Sie zuerst das Beispiel. Dazu haben Sie 10 Sekunden Zeit.","example":[{"no":"01","type":"rf","text":"Das Training heute findet nicht statt.","answer":"R"},{"no":"02","type":"abc","stem":"Das Ersatztraining …","options":{"a":"ist am Donnerstag in einer anderen Halle.","b":"fällt für die Jugendgruppe aus.","c":"beginnt um 18 Uhr."},"answer":"a"}],"texts":[{"label":"Text 1","items":[{"no":"1","type":"rf","text":"Das Flugzeug nach Lissabon startet später als geplant.","answer":"R"},{"no":"2","type":"abc","stem":"Die Passagiere …","options":{"a":"gehen wie auf der Anzeigetafel zum Gate B12.","b":"bekommen am Schalter neue Tickets.","c":"sollen zu einem anderen Gate gehen."},"answer":"c"}]},{"label":"Text 2","items":[{"no":"3","type":"rf","text":"Der Elternabend beginnt zu einer anderen Uhrzeit.","answer":"F"},{"no":"4","type":"abc","stem":"Frau Sander soll …","options":{"a":"ein unterschriebenes Formular mitbringen.","b":"die Lehrerin am Nachmittag zurückrufen.","c":"Emma am Donnerstag in die Schule begleiten."},"answer":"a"}]},{"label":"Text 3","items":[{"no":"5","type":"rf","text":"Für das Fest muss man Eintritt bezahlen.","answer":"F"},{"no":"6","type":"abc","stem":"Wer mit dem Auto kommt, …","options":{"a":"parkt kostenlos direkt am Marktplatz.","b":"fährt mit einem Bus in die Stadt.","c":"zahlt zwölf Euro fürs Parken."},"answer":"b"}]},{"label":"Text 4","items":[{"no":"7","type":"rf","text":"Ein Kind hat im Kaufhaus seine Mutter verloren.","answer":"R"},{"no":"8","type":"abc","stem":"Das Angebot in der Sportabteilung …","options":{"a":"gilt die ganze Woche.","b":"gilt nur heute.","c":"gilt für alle Sportartikel."},"answer":"b"}]},{"label":"Text 5","items":[{"no":"9","type":"rf","text":"Frau Petersen kann beide Brillen abholen.","answer":"F"},{"no":"10","type":"abc","stem":"Die Sonnenbrille …","options":{"a":"ist in zehn Minuten fertig.","b":"kann am Samstag abgeholt werden.","c":"braucht noch einige Tage."},"answer":"c"}]}]},"t2":{"instruction":"Sie hören nun einen Text. Sie hören den Text einmal. Dazu lösen Sie fünf Aufgaben. Wählen Sie bei jeder Aufgabe die richtige Lösung a, b oder c.","readNote":"Lesen Sie jetzt die Aufgaben 11 bis 15. Dazu haben Sie 60 Sekunden Zeit.","context":"Sie besuchen mit einer Gruppe die Schokoladenfabrik Kessler. Vor der Führung begrüßt Sie die Mitarbeiterin Frau Huber.","items":[{"no":"11","stem":"Die Führung …","options":{"a":"endet mit einer Verkostung.","b":"dauert etwa eine Stunde.","c":"beginnt direkt in der Produktion."},"answer":"a"},{"no":"12","stem":"In der Produktion …","options":{"a":"darf man nicht fotografieren.","b":"muss das Handy im Schließfach bleiben.","c":"sind Fotos ohne Blitz erlaubt."},"answer":"a"},{"no":"13","stem":"Wer allergisch gegen Nüsse ist, …","options":{"a":"darf nicht an der Verkostung teilnehmen.","b":"bekommt andere Schokolade.","c":"muss die Produktion auslassen."},"answer":"b"},{"no":"14","stem":"Kinder …","options":{"a":"dürfen aus Sicherheitsgründen nicht in die Produktion.","b":"bekommen im Shop eine kleine Überraschung.","c":"stellen im Museum selbst etwas her."},"answer":"c"},{"no":"15","stem":"Für die Vorführung um vier Uhr …","options":{"a":"zahlt man an der Kasse einen kleinen Betrag.","b":"muss man sich vorher einen Platz sichern.","c":"braucht man das Ticket von der Führung."},"answer":"b"}]},"t3":{"instruction":"Sie hören nun ein Gespräch. Sie hören das Gespräch einmal. Dazu lösen Sie sieben Aufgaben. Wählen Sie: Sind die Aussagen Richtig oder Falsch?","readNote":"Lesen Sie jetzt die Aufgaben 16 bis 22. Dazu haben Sie 60 Sekunden Zeit.","context":"Sie sitzen in einem Café und hören, wie sich zwei Freunde, Sarah und Lukas, über die vergangenen Wochen unterhalten.","items":[{"no":"16","text":"Lukas hat seine neue Stelle über eine Anzeige gefunden.","answer":"F"},{"no":"17","text":"Lukas bekommt in der Buchhandlung ein niedrigeres Gehalt.","answer":"R"},{"no":"18","text":"Lukas’ Mutter war gegen den Wechsel.","answer":"F"},{"no":"19","text":"Lukas arbeitet auch am Samstag.","answer":"R"},{"no":"20","text":"Sarah hat alle Nächte im Zelt geschlafen.","answer":"F"},{"no":"21","text":"Die Band, die Sarah sehen wollte, hat nicht gespielt.","answer":"R"},{"no":"22","text":"Für das nächste Jahr hat Sarah schon eine Unterkunft gebucht.","answer":"R"}]},"t4":{"instruction":"Sie hören nun eine Diskussion. Sie hören die Diskussion zweimal. Dazu lösen Sie acht Aufgaben. Ordnen Sie die Aussagen zu: Wer sagt was?","readNote":"Lesen Sie jetzt die Aussagen 23 bis 30. Dazu haben Sie 60 Sekunden Zeit.","context":"Der Moderator der Radiosendung „Standpunkte“ diskutiert mit der Lehrerin Petra Lindner und dem Schülersprecher Jonas Weiß über die Frage: „Sollen Handys an Schulen verboten werden?“","speakers":{"a":"Moderator","b":"Petra Lindner","c":"Jonas Weiß"},"example":{"no":"0","text":"Über Handyverbote wird in vielen Bundesländern diskutiert.","answer":"a"},"items":[{"no":"23","text":"Seit dem Verbot reden die Schüler in den Pausen wieder miteinander.","answer":"b"},{"no":"24","text":"Das Handy ist ein Hilfsmittel für den Unterricht.","answer":"c"},{"no":"25","text":"Die Schule sollte den richtigen Umgang mit dem Handy vermitteln.","answer":"c"},{"no":"26","text":"Eltern legen Wert darauf, ihr Kind jederzeit anrufen zu können.","answer":"a"},{"no":"27","text":"Ein Verbot verschiebt die Probleme nur in die Freizeit.","answer":"c"},{"no":"28","text":"Jüngere Schüler brauchen feste Regeln von außen.","answer":"b"},{"no":"29","text":"In anderen Ländern gibt es schon Erfahrungen mit Verboten.","answer":"a"},{"no":"30","text":"Auch Lehrkräfte sollten mehr über den Umgang mit Medien lernen.","answer":"b"}]}},"schreiben":{"intro":"Das Modul Schreiben besteht aus drei Teilen. In den Aufgaben 1 und 3 schreiben Sie E-Mails, in Aufgabe 2 schreiben Sie einen Diskussionsbeitrag. Sie können mit jeder Aufgabe beginnen. Schreiben Sie Ihre Texte auf den Antwortbogen.","tasks":[{"no":1,"minutes":20,"words":80,"situation":["Sie haben vor zwei Wochen eine neue Arbeitsstelle angetreten. Ein Freund/Eine Freundin, der/die in einer anderen Stadt wohnt, möchte wissen, wie es Ihnen geht."],"points":["Beschreiben Sie: Wie ist Ihre neue Arbeit?","Begründen Sie: Was gefällt Ihnen besonders gut und warum?","Machen Sie einen Vorschlag für ein Treffen."],"post":null,"instruction":"Schreiben Sie eine E-Mail (circa 80 Wörter). Schreiben Sie etwas zu allen drei Punkten. Achten Sie auf den Textaufbau (Anrede, Einleitung, Reihenfolge der Inhaltspunkte, Schluss).","model":{"label":"E-Mail an einen Freund, ca. 95 Wörter","text":"Betreff: Zwei Wochen neuer Job\n\nLieber Paul,\n\ndu wolltest wissen, wie es mir geht – gut! Seit zwei Wochen arbeite ich in der Stadtbibliothek. Ich bin für die Kinderabteilung zuständig, berate Familien und bereite die Lesestunden am Nachmittag vor. Die Kolleginnen sind freundlich, und um 17 Uhr ist wirklich Schluss.\n\nAm besten gefällt mir die Arbeit mit den Kindern, weil sie ehrlich sagen, ob ein Buch langweilig ist. Davon kann ich viel lernen.\n\nHast du Lust, mich am ersten Oktoberwochenende zu besuchen? Dann zeige ich dir die Bibliothek, und abends gehen wir essen.\n\nLiebe Grüße\nElena"},"typicalErrors":"Leitpunkt 3 (Treffen) fehlt oder bleibt ohne Zeit und Ort · die Arbeit nur beschreiben, ohne zu begründen · Sie statt du."},{"no":2,"minutes":25,"words":80,"situation":["Sie haben im Fernsehen eine Sendung zum Thema „Lebensmittel aus der Region – lohnt sich der höhere Preis?“ gesehen. Im Online-Gästebuch der Sendung finden Sie folgende Meinung:"],"points":[],"post":{"site":"www.tv-forum-aktuell.de","label":"Gästebuch","author":"Kerstin · 14.09. 21:05 Uhr","text":"Ich kaufe Obst und Gemüse seit einem Jahr auf dem Wochenmarkt, bei Bauern aus der Umgebung. Es schmeckt besser, und ich weiß, woher es kommt. Aber ehrlich: Für eine Familie mit drei Kindern ist das auf Dauer zu teuer, und im Winter gibt es fast nur Kohl und Kartoffeln."},"instruction":"Schreiben Sie nun Ihre Meinung zum Thema (circa 80 Wörter).","model":{"label":"Diskussionsbeitrag, ca. 95 Wörter","text":"Kerstin spricht ein Problem an, das ich gut kenne. Auch ich kaufe Gemüse gern auf dem Markt, weil es frischer ist und die Bauern aus der Nähe kommen. Meiner Meinung nach ist der höhere Preis oft gerechtfertigt: Kurze Wege sind besser für die Umwelt, und das Geld bleibt in der Region.\n\nTrotzdem verstehe ich Familien, die rechnen müssen. Ich kaufe deshalb regional nur das, was gerade Saison hat – im Sommer Beeren, im Herbst Äpfel. Das ist dann sogar günstiger als im Supermarkt.\n\nIm Winter muss man Kompromisse machen. Kohl und Kartoffeln sind allerdings gesünder, als viele glauben – und günstig sind sie auch."},"typicalErrors":"Kerstins Beitrag nur zusammenfassen, statt eine eigene Meinung zu schreiben · keine Beispiele · deutlich unter 80 Wörtern."},{"no":3,"minutes":15,"words":40,"situation":["Ihr Deutschkurs macht am Samstag einen Ausflug in ein Museum. Sie haben sich dafür angemeldet, können aber nicht mitkommen."],"points":[],"post":null,"instruction":"Schreiben Sie an Ihre Kursleiterin, Frau Sommer. Entschuldigen Sie sich höflich, nennen Sie den Grund und fragen Sie, ob Sie das Geld für die Eintrittskarte zurückbekommen. Schreiben Sie eine E-Mail (circa 40 Wörter). Vergessen Sie nicht die Anrede und den Gruß am Schluss.","model":{"label":"E-Mail an die Kursleiterin, ca. 45 Wörter","text":"Sehr geehrte Frau Sommer,\n\nleider kann ich am Samstag nicht mit ins Museum kommen, weil ich an diesem Tag arbeiten muss. Das tut mir sehr leid. Könnten Sie mir sagen, ob ich das Geld für die Eintrittskarte zurückbekomme? Ich wünsche Ihnen und dem Kurs einen schönen Ausflug.\n\nMit freundlichen Grüßen\nAmir Nouri"},"typicalErrors":"Grund oder Frage nach dem Geld fehlt · Hallo Frau Sommer oder Liebe Grüße gegenüber der Kursleiterin · keine Entschuldigung."}]},"audio":[{"src":"Goethe%20B1%20Modelltest%203.1.mp3","dur":647.16},{"src":"Goethe%20B1%20Modelltest%203.2.mp3","dur":257.04},{"src":"Goethe%20B1%20Modelltest%203.3.mp3","dur":259.34},{"src":"Goethe%20B1%20Modelltest%203.4.mp3","dur":587.73}],"pdf":"Goethe%20B1%20Modelltest%203.pdf","pages":{"loesung":17,"muster":18,"kommentar":20,"hoertexte":22}},"4":{"id":4,"roman":"IV","lesen":{"t1":{"instruction":"Lesen Sie den Text und die Aufgaben 1 bis 6 dazu. Wählen Sie: Sind die Aussagen Richtig oder Falsch?","blog":{"site":"dienstags-um-acht.de · Daniel","date":"Sonntag, 8. Dezember","title":"Lampenfieber","paragraphs":["Gestern war es so weit: mein erstes Konzert. Wer mich kennt, weiß, dass ich bisher höchstens unter der Dusche gesungen habe – und auch das nur, wenn niemand zu Hause war. Dass ich jetzt in einem Chor stehe, habe ich Birgit zu verdanken. Sie sitzt im Büro neben mir und hat im Januar so lange von ihrem Chor „Querbeet“ geschwärmt, bis ich an einem Dienstag mitgegangen bin – eigentlich nur, damit sie endlich Ruhe gibt.","Vor dem ersten Abend hatte ich richtig Angst. Aber Ines, unsere Chorleiterin, hat nur gelacht: Vorsingen muss bei „Querbeet“ niemand. Sie hat mich neben Herrn Petzold gestellt, der seit dreißig Jahren im Bass singt, und gesagt: „Mach einfach, was er macht.“ Noten lesen kann ich bis heute nicht. Ines schickt uns aber nach jeder Probe Aufnahmen aufs Handy, und die habe ich monatelang im Auto gehört, auf dem Weg zur Arbeit und zurück. Die Leute, die neben mir im Stau stehen, halten mich wahrscheinlich für verrückt.","Und dann, zwei Tage vor dem Konzert, bin ich erkältet aufgewacht und habe kaum ein Wort herausgebracht. Ich habe literweise Tee mit Honig getrunken und im Büro nur noch E-Mails geschrieben, statt zu telefonieren. Ines schrieb mir, notfalls solle ich eben nur die Lippen bewegen. Am Samstag war die Stimme zum Glück fast wieder da – ganz laut habe ich trotzdem nicht gesungen.","Der Saal im Rathaus war mit dreihundert Leuten ausverkauft. Meine Frau musste ausgerechnet an diesem Wochenende beruflich nach Hamburg. Dafür saß meine Schwester mit ihren beiden Kindern in der ersten Reihe und hat alles für meine Frau gefilmt. Vor dem ersten Lied hatte ich weiche Knie. Beim dritten Lied habe ich den Text vergessen, aber Herr Petzold hat ihn mir leise vorgesagt. Gemerkt hat es niemand – hoffe ich.","Nach dem Konzert sind wir alle zusammen Pizza essen gegangen, und Birgit hat mich den ganzen Abend angegrinst, als wollte sie sagen: Siehst du? Da wusste ich: Ich bleibe dabei. Für Februar habe ich mich schon für einen Kurs an der Musikschule angemeldet: „Notenlesen für Anfänger“. Ein Solo beim Sommerkonzert, wie Birgit vorschlägt? Das überlasse ich lieber den anderen."],"closing":"Bis bald, Daniel"},"example":{"no":"0","text":"Daniel singt seit diesem Jahr in einem Chor.","answer":"R"},"items":[{"no":"1","text":"Die Idee, in einem Chor zu singen, kam nicht von Daniel selbst.","answer":"R"},{"no":"2","text":"Bei „Querbeet“ wird niemand vor der Aufnahme geprüft.","answer":"R"},{"no":"3","text":"Beim Üben hat sich Daniel vor allem auf Noten verlassen.","answer":"F"},{"no":"4","text":"Weil er krank war, hat Daniel beim Konzert nicht mitgesungen.","answer":"F"},{"no":"5","text":"Daniels Frau war beim Konzert nicht dabei.","answer":"R"},{"no":"6","text":"Daniel hat vor, beim Sommerkonzert allein zu singen.","answer":"F"}]},"t2":{"texts":[{"instruction":"Lesen Sie den Text aus der Presse und die Aufgaben 7 bis 9 dazu. Wählen Sie bei jeder Aufgabe die richtige Lösung a, b oder c.","title":"Eine Stunde Ruhe","lead":"In Oberkirchen dreht ein Supermarkt jeden Mittwoch Musik und Licht herunter.","paragraphs":["Jeden Mittwoch um 15 Uhr wird es im Supermarkt von Stefan Kröger in Oberkirchen plötzlich still. Die Musik aus den Lautsprechern verstummt, das Licht wird um die Hälfte gedimmt, und Durchsagen gibt es bis 16 Uhr keine. Auch die Regale werden in dieser Stunde nicht aufgefüllt, damit keine Rollwagen durch die Gänge fahren. An der „Kasse mit Zeit“ darf niemand drängeln: Wer dort langsamer einpackt oder länger nach Kleingeld sucht, wird nicht gehetzt. Auf die Idee gebracht hat Kröger der Brief einer Mutter. Ihr Sohn ist Autist, und das Einkaufen endete für beide oft in Tränen. „Ich hätte nie gedacht, wie laut mein eigener Laden ist“, sagt Kröger. Ähnliche Angebote gibt es in anderen Ländern schon länger. Die Preise bleiben in der stillen Stunde dieselben – es geht nicht ums Sparen, sondern um Ruhe. An den übrigen Tagen läuft alles wie gewohnt. Genutzt wird das Angebot von mehr Menschen als erwartet: von älteren Kunden, Eltern mit Babys und Leuten, die nach der Arbeit einfach ihre Ruhe wollen. „Zum ersten Mal kann ich in Ruhe überlegen, was ich brauche“, sagt eine Rentnerin, die jeden Mittwoch kommt. Auch die Kassiererinnen genießen die ruhige Stunde. Einige Stammkunden haben sich allerdings beschwert, sie könnten die Preisschilder im Halbdunkel kaum lesen. Kröger nimmt das ernst und lässt die Schilder heller beleuchten. Ab Januar soll es am Samstagmorgen eine zweite stille Stunde geben."],"footnote":"","source":"aus einer deutschen Zeitung","example":{"no":"0","stem":"Die stille Stunde …","options":{"a":"gibt es jeden Tag.","b":"gibt es einmal pro Woche.","c":"gibt es nur am Wochenende."},"answer":"b"},"items":[{"no":"7","stem":"In diesem Text geht es um …","options":{"a":"einen Supermarkt, der nachmittags für eine Stunde schließt.","b":"Angestellte, die sich bei der Arbeit mehr Ruhe wünschen.","c":"ein Angebot für Kunden, denen es im Laden oft zu laut ist."},"answer":"c"},{"no":"8","stem":"In der stillen Stunde …","options":{"a":"muss sich an einer Kasse niemand beeilen.","b":"sind die Waren günstiger als sonst.","c":"werden die Regale im ganzen Markt mit neuer Ware gefüllt."},"answer":"a"},{"no":"9","stem":"Stefan Kröger …","options":{"a":"ist auf einer Reise ins Ausland auf die Idee gekommen.","b":"will die ruhige Stunde bald auch an einem weiteren Tag anbieten.","c":"hält die Beschwerden einiger Stammkunden insgesamt für übertrieben."},"answer":"b"}]},{"instruction":"Lesen Sie den Text aus der Presse und die Aufgaben 10 bis 12 dazu. Wählen Sie bei jeder Aufgabe die richtige Lösung a, b oder c.","title":"Zu Gast in der Schulkantine","lead":"In Hallein essen Pensionisten* mittags gemeinsam mit Schulkindern.","paragraphs":["Montag, Mittwoch und Freitag, 12.30 Uhr: In der Kantine der Mittelschule Hallein stehen dann nicht nur Zwölfjährige mit ihrem Tablett in der Schlange, sondern auch Menschen, die ihre eigene Schulzeit vor sechzig Jahren beendet haben. Seit dem Herbst können bis zu fünfzehn Pensionistinnen und Pensionisten hier gemeinsam mit den Kindern zu Mittag essen. Die Idee hatte Schulköchin Renate Moser: „Wir hatten jeden Tag Essen übrig, und meine Mutter hat mir oft erzählt, wie einsam sie allein in ihrer Küche isst.“ Auf den Teller kommt dasselbe wie bei den Kindern. Die Gäste zahlen 5,50 Euro, genauso viel wie die Lehrkräfte; für die Kinder kostet das Menü 3,80 Euro. Wer kommen will, meldet sich bis Donnerstag für die folgende Woche im Sekretariat an, damit die Küche planen kann. Am Anfang saßen die älteren Gäste an einem eigenen Tisch am Fenster. Seit Weihnachten setzt sich jeder dorthin, wo Platz ist. „Die Kinder sind ruhiger geworden und tragen unaufgefordert Tabletts für Leute mit Gehstock“, erzählt Direktor Martin Eder. Auch die Gäste lernen dazu: Eine 79-Jährige berichtet, die Kinder hätten ihr gezeigt, wie man Fotos mit dem Handy verschickt. Ein pensionierter Mathematiklehrer bleibt oft noch eine halbe Stunde und hilft bei den Hausaufgaben. Inzwischen stehen zwanzig Namen auf der Warteliste. Mehr Gäste kann die Kantine aber nicht aufnehmen, und auf alle fünf Schultage ausweiten will Moser das Angebot auch nicht: Dafür fehlt in der Küche das Personal."],"footnote":"*Pensionist = österreichischer Standard für „Rentner“","source":"aus einer österreichischen Zeitung","example":null,"items":[{"no":"10","stem":"In diesem Text geht es um …","options":{"a":"eine Schulküche, die Kochkurse für ältere Menschen anbietet.","b":"ältere Menschen, die mittags gemeinsam mit Kindern essen.","c":"Schulkinder, die älteren Menschen das Essen nach Hause bringen."},"answer":"b"},{"no":"11","stem":"Wer als Gast mitessen möchte, …","options":{"a":"zahlt dafür weniger als die Schülerinnen und Schüler.","b":"bekommt ein eigenes Menü.","c":"muss das einige Tage im Voraus mitteilen."},"answer":"c"},{"no":"12","stem":"Das Angebot …","options":{"a":"hat mehr Interessenten, als es Plätze gibt.","b":"soll bald an allen Schultagen stattfinden.","c":"wird von der Schulleitung eher kritisch gesehen."},"answer":"a"}]}]},"t3":{"instruction":"Lesen Sie die Situationen 13 bis 19 und die Anzeigen a bis j aus verschiedenen deutschsprachigen Medien. Wählen Sie: Welche Anzeige passt zu welcher Situation? Sie können jede Anzeige nur einmal verwenden. Die Anzeige aus dem Beispiel können Sie nicht mehr verwenden. Für eine Situation gibt es keine passende Anzeige. In diesem Fall schreiben Sie 0.","context":"Einige Ihrer Bekannten suchen eine Stelle, einen Ausbildungsplatz oder einen Nebenjob.","example":{"no":"0","text":"Lena studiert und möchte am Wochenende Gäste bedienen.","answer":"b"},"items":[{"no":"13","text":"Herr Okafor ist seit Kurzem in Rente. Er sitzt gern hinter dem Steuer und möchte sich ein paar Stunden in der Woche etwas dazuverdienen.","answer":"h"},{"no":"14","text":"Sofia spricht drei Sprachen und möchte sie im Beruf täglich nutzen. Nachmittags holt sie ihren Sohn von der Schule ab.","answer":"d"},{"no":"15","text":"Tim ist sechzehn und möchte in den Sommerferien an der frischen Luft Geld verdienen.","answer":"a"},{"no":"16","text":"Frau Brandt ist gelernte Friseurin. Sie möchte wieder in ihrem Beruf arbeiten, aber nur in den Stunden, in denen ihre Kinder im Kindergarten sind.","answer":"g"},{"no":"17","text":"Jonas hat gerade die Schule abgeschlossen und möchte einen Beruf lernen, bei dem er nicht den ganzen Tag im Büro sitzt.","answer":"e"},{"no":"18","text":"Frau Nguyen kann nach einer Operation das Haus kaum verlassen. Sie sucht eine Arbeit am Computer, die sie von der Wohnung aus erledigen kann.","answer":"0"},{"no":"19","text":"Herr Weber arbeitet tagsüber in einer Bank und sucht für zwei, drei Abende pro Woche eine Nebenbeschäftigung.","answer":"j"}],"ads":[{"letter":"a","header":"","tag":"","title":"FERIENJOB AUF DEM ERDBEERFELD!","subtitle":"","facts":[],"body":["Im Juli und August suchen wir Helferinnen und Helfer ab 16 Jahren für die Ernte und den Verkauf an unseren Ständen. Täglich von 7 bis 13 Uhr, die Wochenenden sind frei. Mittagessen auf dem Hof inklusive. Einfach anrufen oder vorbeikommen!"],"footer":"Erdbeerhof Lindemann · Feldweg 3 · 0421 / 57 57 30"},{"letter":"b","header":"","tag":"","title":"Café Kornblume","subtitle":"sucht Verstärkung!","facts":[],"body":["Aushilfe im Service – samstags und sonntags, jeweils 8 bis 14 Uhr. Studierende sind herzlich willkommen, Erfahrung ist nicht nötig: Wir arbeiten dich ein. Gute Laune und Freude am Umgang mit Gästen bringst du bitte mit."],"footer":"Lindenplatz 7 · frag einfach an der Theke nach Mia"},{"letter":"c","header":"NordKontakt GmbH","tag":"STELLENANGEBOT","title":"Kundenberater/-in (m/w/d) in Vollzeit","subtitle":"","facts":[],"body":["Sie beantworten Anfragen per Telefon, E-Mail und Chat – auf Deutsch und Englisch, Spanischkenntnisse sind von Vorteil. Schichtdienst zwischen 8 und 20 Uhr in unserem Büro am Hauptbahnhof. Homeoffice ist in dieser Position leider nicht möglich."],"footer":"Bewerbung an jobs@nordkontakt.de"},{"letter":"d","header":"","tag":"","title":"Hotel am Schlossgarten","subtitle":"","facts":[],"body":["Für unsere Rezeption suchen wir ab sofort Verstärkung im Frühdienst, montags bis freitags von 7 bis 13 Uhr. Sie sprechen neben Deutsch fließend Englisch und mindestens eine weitere Fremdsprache und empfangen täglich unsere internationalen Gäste."],"footer":"personal@hotel-schlossgarten.de"},{"letter":"e","header":"Gärtnerei Grünwerk","tag":"AUSBILDUNG","title":"Gärtner/-in (m/w/d) · Beginn 1. August","subtitle":"","facts":[],"body":["Drei Jahre lang lernen Sie bei uns, Pflanzen zu ziehen sowie Gärten anzulegen und zu pflegen – bei fast jedem Wetter draußen. Sie haben einen Schulabschluss und packen gern mit an? Dann freuen wir uns auf Ihre Bewerbung. Ferien- und Aushilfsjobs bieten wir leider nicht an."],"footer":""},{"letter":"f","header":"","tag":"Erst ab 18","title":"Wir stellen ein!","subtitle":"Aushilfen für Kasse und Lager (m/w/d)","facts":[],"body":["Flexible Arbeitszeiten vormittags oder nachmittags – auch in den Schulferien. Keine Vorkenntnisse nötig, wir arbeiten Sie ein. Den Bewerbungsbogen bekommen Sie an unserer Information oder online."],"footer":"FRISCHEMARKT KÜHN · frischemarkt-kuehn.de/karriere"},{"letter":"g","header":"","tag":"","title":"HAARWERK","subtitle":"FRISEURSALON","facts":[],"body":["Friseur/-in (m/w/d) in Teilzeit gesucht. Unser kleines Team braucht Verstärkung für die Vormittage: Montag bis Freitag, 8.30 bis 12.30 Uhr. Samstags arbeitet bei uns nur, wer möchte. Abgeschlossene Ausbildung erforderlich – auch Wiedereinsteigerinnen nach der Elternzeit sind willkommen."],"footer":"Tel. 0421 / 30 20 10"},{"letter":"h","header":"APOTHEKE AM MARKT · KARRIERE","tag":"","title":"Botenfahrer/-in auf Minijob-Basis","subtitle":"","facts":[],"body":["Sie bringen Medikamente zu Kundinnen und Kunden im Stadtgebiet – an drei Vormittagen pro Woche, jeweils etwa vier Stunden. Ein Dienstwagen steht zur Verfügung, Sie brauchen nur einen Führerschein der Klasse B. Gern auch Rentnerinnen und Rentner."],"footer":"Jetzt bewerben · apotheke-am-markt.de/jobs"},{"letter":"i","header":"","tag":"","title":"FAHRER/-IN GESUCHT!","subtitle":"","facts":[],"body":["Paketzustellung in Vollzeit, 40 Stunden pro Woche im Nachtdienst. Voraussetzung: eigenes Fahrzeug und mindestens zwei Jahre Fahrpraxis. Wir zahlen über Tarif und erstatten das Benzin. Start sofort möglich."],"footer":"BLITZ-KURIER · Bewerbung per WhatsApp: 0170 / 555 12 12"},{"letter":"j","header":"","tag":"","title":"CAPITOL","subtitle":"FILMTHEATER","facts":[],"body":["Aushilfe für Kasse und Einlass (m/w/d). Du arbeitest abends ab 18 Uhr und am Wochenende, mindestens zwei Abende pro Woche – den Dienstplan machen wir gemeinsam. Mindestalter 18 Jahre. Als Dankeschön gibt es Freikarten für alle Vorstellungen."],"footer":"jobs@capitol-kino.de"}]},"t4":{"instruction":"Lesen Sie die Texte 20 bis 26. Wählen Sie: Ist die Person für offene Geschäfte am Sonntag, Ja oder Nein?","context":"In einer Zeitschrift lesen Sie Kommentare zu einem Artikel über Städte, in denen Geschäfte künftig auch sonntags öffnen dürfen.","header":"LESERKOMMENTARE","site":"www.verbraucher-magazin.de/forum","example":{"no":"0","name":"Ursula","byline":"Ursula, 58, Stuttgart","text":"Sechs Tage in der Woche kann man einkaufen, bis spät am Abend und inzwischen auch im Internet. Der Sonntag ist der einzige Tag, an dem ganze Familien gemeinsam frei haben – auch die der Verkäuferinnen. Wer am Sonntag unbedingt neue Schuhe braucht, hat schlecht geplant. Lasst uns diesen einen ruhigen Tag, bevor er genauso hektisch wird wie alle anderen.","answer":"N"},"items":[{"no":"20","name":"Marco","byline":"Marco, 29, Leipzig","text":"Ich arbeite als Pfleger im Schichtdienst, oft von Montag bis Samstag. Wenn ich frei habe, sind die Geschäfte entweder zu oder so voll, dass ich nach zehn Minuten wieder gehe. Für Leute wie mich wäre ein offener Laden am Sonntag keine Bequemlichkeit, sondern die einzige Möglichkeit, in Ruhe einzukaufen. Im Krankenhaus fragt übrigens auch niemand, ob Sonntag ist.","answer":"J"},{"no":"21","name":"Heike","byline":"Heike, 47, Innsbruck","text":"Natürlich verstehe ich alle, die unter der Woche keine Zeit zum Einkaufen haben. Ich stehe aber selbst seit zwanzig Jahren an der Kasse, und der Sonntag ist der einzige Tag, an dem ich meine Tochter garantiert sehe. „Freiwillig“ klingt schön, aber wer im Handel Nein sagt, bekommt beim nächsten Dienstplan eben die schlechteren Schichten. Das kenne ich schon von den Samstagen.","answer":"N"},{"no":"22","name":"Elif","byline":"Elif, 41, Köln","text":"Meine Kundinnen sagen mir fast jede Woche, sie würden gern auch am Sonntag vorbeikommen. Aber ich führe ein kleines Schreibwarengeschäft, zusammen mit einer einzigen Mitarbeiterin. Wer soll da am siebten Tag hinter der Theke stehen? Die großen Ketten haben genug Personal – sie gewinnen, und Läden wie meiner verlieren noch mehr Kundschaft. Deshalb hoffe ich, dass die Stadt es beim alten Gesetz belässt.","answer":"N"},{"no":"23","name":"Florian","byline":"Florian, 35, Bern","text":"Für mich hängt alles davon ab, wie es für die Angestellten geregelt ist. Wenn nur Leute arbeiten, die das freiwillig tun, und wenn sie dafür deutlich mehr Lohn bekommen, spricht aus meiner Sicht nichts dagegen. Genau das sieht das neue Gesetz vor, über das der Artikel berichtet. Ich freue mich also schon darauf, sonntags nach dem Wandern noch schnell etwas einzukaufen.","answer":"J"},{"no":"24","name":"Rainer","byline":"Rainer, 66, Dresden","text":"Als unsere Stadt im letzten Jahr vier offene Sonntage ausprobiert hat, habe ich meinen Nachbarn gesagt: Da gehe ich bestimmt nicht hin. Dann bin ich mit meiner Frau doch einmal hingegangen, eigentlich nur, um zu schimpfen. Wir sind durch die Altstadt gebummelt, haben Kaffee getrunken und ohne Gedränge Geschenke für die Enkel gekauft. Heute sehe ich das anders: Von mir aus könnte es jeden Sonntag so sein.","answer":"J"},{"no":"25","name":"Jana","byline":"Jana, 23, Graz","text":"Ich jobbe neben dem Studium in einer Drogerie und sehe jeden Abend, wie voll es kurz vor Ladenschluss ist. Das Problem ist nicht der Sonntag, sondern dass viele Geschäfte schon um 18 Uhr schließen – genau dann, wenn alle aus dem Büro kommen. Man sollte die Läden unter der Woche bis 21 Uhr offen lassen. Den Sonntag brauchen dagegen alle, um sich zu erholen, auch ich.","answer":"N"},{"no":"26","name":"Tobias","byline":"Tobias, 38, Hamburg","text":"Seit meine Frau und ich beide Vollzeit arbeiten, ist unser Samstag ein einziger Einkaufsmarathon: Supermarkt, Baumarkt, Schuhe für die Kinder, alles in wenigen Stunden. Zeit für die Familie bleibt da kaum. Könnten wir einen Teil davon auf den Sonntag verschieben, hätten wir den Samstag endlich wieder für Ausflüge. Wer sonntags lieber zu Hause bleibt, muss ja nicht losgehen.","answer":"J"}]},"t5":{"instruction":"Lesen Sie die Aufgaben 27 bis 30 und den Text dazu. Wählen Sie bei jeder Aufgabe die richtige Lösung a, b oder c.","context":"Sie haben sich in einem Fitnessstudio angemeldet und lesen die Studioordnung.","doc":{"title":"STUDIOORDNUNG · FITNESSSTUDIO VITAL","intro":"","sections":[{"heading":"Mitgliedschaft und Zutritt","text":"Mitglied werden kann man ab 14 Jahren; bis zum 18. Geburtstag ist die schriftliche Zustimmung der Eltern nötig. Jugendliche unter 16 Jahren dürfen nur in Begleitung eines erwachsenen Mitglieds trainieren. Der Zutritt erfolgt mit dem persönlichen Mitgliedsarmband, das nicht an andere Personen weitergegeben werden darf."},{"heading":"Öffnungszeiten und Betreuung","text":"Das Studio ist täglich von 6 bis 23 Uhr geöffnet, an Feiertagen gelten gesonderte Zeiten. Unsere Trainerinnen und Trainer sind montags bis freitags von 9 bis 21 Uhr für Sie da. Außerhalb dieser Zeiten dürfen nur Mitglieder an den Geräten trainieren, die bereits eine Einweisung erhalten haben. Die Kurse sind im Monatsbeitrag enthalten; eine Anmeldung über die Studio-App ist erforderlich."},{"heading":"Hygiene","text":"Bitte legen Sie beim Training immer ein Handtuch unter und reinigen Sie die Geräte nach der Benutzung mit dem bereitstehenden Spray. Straßenschuhe sind in den Trainingsräumen nicht gestattet, Getränke nur in verschließbaren Flaschen."},{"heading":"Schließfächer","text":"Die Schließfächer dürfen nur während des Aufenthalts im Studio benutzt werden. Fächer, die nach Schließung noch belegt sind, werden geöffnet und geleert. Für Wertsachen übernimmt das Studio keine Haftung."},{"heading":"Pause und Kündigung","text":"Bei längerer Krankheit kann die Mitgliedschaft gegen Vorlage eines ärztlichen Attests für höchstens drei Monate im Jahr beitragsfrei ruhen. Eine Kündigung ist mit einer Frist von einem Monat zum Ende der Vertragslaufzeit möglich und muss schriftlich per Brief erfolgen."},{"heading":"Gäste","text":"Jedes Mitglied darf einmal im Monat eine Begleitperson kostenlos mitbringen; weitere Besuche sind mit einer Tageskarte für 12 Euro möglich. Gäste melden sich an der Theke mit einem gültigen Ausweis an."}],"footer":""},"example":null,"items":[{"no":"27","stem":"Wer 15 Jahre alt ist, …","options":{"a":"braucht nur eine Unterschrift der Eltern.","b":"darf nur zusammen mit einem Erwachsenen trainieren.","c":"kann in diesem Alter noch nicht Mitglied im Studio werden."},"answer":"b"},{"no":"28","stem":"Wer nach 21 Uhr trainieren möchte, …","options":{"a":"muss einen Zuschlag bezahlen.","b":"muss sich vorher über die Studio-App dafür anmelden.","c":"muss vorher an den Geräten eingewiesen worden sein."},"answer":"c"},{"no":"29","stem":"Wer längere Zeit krank ist, …","options":{"a":"kann eine Pause machen, in der er nichts bezahlt.","b":"kann den Vertrag sofort per E-Mail kündigen.","c":"zahlt während der Pause den halben Beitrag."},"answer":"a"},{"no":"30","stem":"Wer eine Freundin zum Training mitnehmen möchte, …","options":{"a":"kann sie jede Woche kostenlos und ohne Anmeldung mitbringen.","b":"muss darauf achten, dass sie einen Ausweis dabeihat.","c":"muss für sie an der Theke eine Tageskarte kaufen."},"answer":"b"}]}},"hoeren":{"t1":{"instruction":"Sie hören nun fünf kurze Texte. Sie hören jeden Text zweimal. Zu jedem Text lösen Sie zwei Aufgaben. Wählen Sie bei jeder Aufgabe die richtige Lösung.","readNote":"Lesen Sie zuerst das Beispiel. Dazu haben Sie 10 Sekunden Zeit.","example":[{"no":"01","type":"rf","text":"Am Dienstagvormittag gibt es im Haus kein Wasser.","answer":"R"},{"no":"02","type":"abc","stem":"Frau Albers soll …","options":{"a":"sich vorher Wasser in Flaschen abfüllen.","b":"am Dienstag zu Hause bleiben.","c":"den Hausmeister anrufen."},"answer":"a"}],"texts":[{"label":"Text 1","items":[{"no":"1","type":"rf","text":"Die Fähre erreicht den Hafen zur geplanten Zeit.","answer":"F"},{"no":"2","type":"abc","stem":"Wer mit dem Auto reist, …","options":{"a":"soll schon jetzt zu seinem Fahrzeug gehen.","b":"verlässt das Schiff über Deck 2.","c":"muss auf eine weitere Durchsage warten."},"answer":"c"}]},{"label":"Text 2","items":[{"no":"3","type":"rf","text":"Katrin hat den ursprünglichen Plan für das Geschenk geändert.","answer":"R"},{"no":"4","type":"abc","stem":"Sven soll …","options":{"a":"dafür sorgen, dass alle eine Karte unterschreiben.","b":"das Geld für das Geschenk bei den Kollegen einsammeln.","c":"um zwölf Uhr in die Kantine kommen."},"answer":"a"}]},{"label":"Text 3","items":[{"no":"5","type":"rf","text":"Die Antwort auf die Frage erfährt man im Programm des Senders.","answer":"R"},{"no":"6","type":"abc","stem":"Wer gewinnt, …","options":{"a":"erfährt es noch am selben Abend.","b":"wird vom Sender angerufen.","c":"holt die Karten an der Abendkasse ab."},"answer":"b"}]},{"label":"Text 4","items":[{"no":"7","type":"rf","text":"Die Seelöwen werden heute nicht gefüttert.","answer":"F"},{"no":"8","type":"abc","stem":"Heute …","options":{"a":"ist die Aussichtsplattform gesperrt.","b":"ist der Zoo länger geöffnet als sonst.","c":"kann man das Tropenhaus nicht besuchen."},"answer":"c"}]},{"label":"Text 5","items":[{"no":"9","type":"rf","text":"Herr Demir muss für die Abholung einen Termin vereinbaren.","answer":"F"},{"no":"10","type":"abc","stem":"Den alten Pass …","options":{"a":"muss Herr Demir im Amt abgeben.","b":"bekommt Herr Demir entwertet zurück.","c":"braucht Herr Demir nicht mitzubringen."},"answer":"b"}]}]},"t2":{"instruction":"Sie hören nun einen Text. Sie hören den Text einmal. Dazu lösen Sie fünf Aufgaben. Wählen Sie bei jeder Aufgabe die richtige Lösung a, b oder c.","readNote":"Lesen Sie jetzt die Aufgaben 11 bis 15. Dazu haben Sie 60 Sekunden Zeit.","context":"Sie machen mit einer Gruppe eine Kanutour auf der Lahn. Vor dem Start erklärt der Tourleiter, Herr Brandes, den Ablauf.","items":[{"no":"11","stem":"Die Tour …","options":{"a":"wird bei Regen abgebrochen.","b":"endet an einem anderen Ort, als sie beginnt.","c":"dauert mit allen Pausen etwa vier Stunden."},"answer":"b"},{"no":"12","stem":"Handys und Autoschlüssel …","options":{"a":"werden mit dem Gepäck transportiert.","b":"sollte man während der Tour in der Hosentasche tragen.","c":"kommen in einen Behälter, der nicht nass wird."},"answer":"c"},{"no":"13","stem":"Wer sich im Wasser unsicher fühlt, …","options":{"a":"paddelt im Boot des Tourleiters mit.","b":"bekommt eine besondere, größere Schwimmweste.","c":"muss im Boot hinten sitzen."},"answer":"a"},{"no":"14","stem":"An der Schleuse …","options":{"a":"tragen alle ihr Boot um die Schleuse herum.","b":"machen alle eine längere Pause.","c":"muss niemand aus dem Boot steigen."},"answer":"c"},{"no":"15","stem":"In der Mittagspause …","options":{"a":"kann man am Kiosk etwas kaufen.","b":"bekommen alle vom Tourleiter etwas zu essen.","c":"füllt man die Wasserflaschen am Campingplatz auf."},"answer":"b"}]},"t3":{"instruction":"Sie hören nun ein Gespräch. Sie hören das Gespräch einmal. Dazu lösen Sie sieben Aufgaben. Wählen Sie: Sind die Aussagen Richtig oder Falsch?","readNote":"Lesen Sie jetzt die Aufgaben 16 bis 22. Dazu haben Sie 60 Sekunden Zeit.","context":"Sie stehen an einer Bushaltestelle und hören, wie sich zwei Nachbarn, Frau Kaya und Herr Lorenz, unterhalten.","items":[{"no":"16","text":"Herr Lorenz ist mit seinem Bruder gewandert.","answer":"F"},{"no":"17","text":"In den ersten Tagen tat Herrn Lorenz das Laufen weh.","answer":"R"},{"no":"18","text":"Herr Lorenz hat nicht jede Nacht in einer Pilgerherberge verbracht.","answer":"R"},{"no":"19","text":"Herr Lorenz möchte die restliche Strecke allein gehen.","answer":"F"},{"no":"20","text":"Das Klassentreffen war Frau Kayas Idee.","answer":"F"},{"no":"21","text":"Das Gebäude der früheren Schule steht nicht mehr.","answer":"R"},{"no":"22","text":"Die ehemalige Klassenlehrerin wird nicht zum Treffen kommen.","answer":"F"}]},"t4":{"instruction":"Sie hören nun eine Diskussion. Sie hören die Diskussion zweimal. Dazu lösen Sie acht Aufgaben. Ordnen Sie die Aussagen zu: Wer sagt was?","readNote":"Lesen Sie jetzt die Aussagen 23 bis 30. Dazu haben Sie 60 Sekunden Zeit.","context":"Die Moderatorin der Radiosendung „Standpunkte“ diskutiert mit der Café-Besitzerin Miriam Scholz und dem Verbraucherberater Klaus Hartmann über die Frage: „Brauchen wir noch Bargeld?“","speakers":{"a":"Moderatorin","b":"Miriam Scholz","c":"Klaus Hartmann"},"example":{"no":"0","text":"Viele Menschen in Deutschland bezahlen noch gern mit Scheinen und Münzen.","answer":"a"},"items":[{"no":"23","text":"Seit im Café kein Bargeld mehr angenommen wird, warten die Kunden kürzer.","answer":"b"},{"no":"24","text":"Wer bar bezahlt, kann seine Ausgaben besser kontrollieren.","answer":"c"},{"no":"25","text":"Auch das Bezahlen mit Karte kostet die Geschäfte Geld.","answer":"a"},{"no":"26","text":"Ohne Bargeld im Laden ist die Arbeit sicherer geworden.","answer":"b"},{"no":"27","text":"Mit jeder Kartenzahlung gibt man Informationen über sich preis.","answer":"c"},{"no":"28","text":"Auch ältere Menschen kommen mit dem Bezahlen per Handy zurecht.","answer":"b"},{"no":"29","text":"In einigen Ländern wird Bargeld heute kaum noch benutzt.","answer":"a"},{"no":"30","text":"Man sollte überall selbst wählen dürfen, wie man bezahlt.","answer":"c"}]}},"schreiben":{"intro":"Das Modul Schreiben besteht aus drei Teilen. In den Aufgaben 1 und 3 schreiben Sie E-Mails, in Aufgabe 2 schreiben Sie einen Diskussionsbeitrag. Sie können mit jeder Aufgabe beginnen. Schreiben Sie Ihre Texte auf den Antwortbogen.","tasks":[{"no":1,"minutes":20,"words":80,"situation":["Sie haben letzte Woche Ihre Führerscheinprüfung bestanden. Ein Freund/Eine Freundin von Ihnen, der/die in einer anderen Stadt wohnt, weiß noch nichts davon."],"points":["Beschreiben Sie: Wie war die Prüfung?","Begründen Sie: Warum ist der Führerschein für Sie wichtig?","Machen Sie einen Vorschlag für einen gemeinsamen Ausflug."],"post":null,"instruction":"Schreiben Sie eine E-Mail (circa 80 Wörter). Schreiben Sie etwas zu allen drei Punkten. Achten Sie auf den Textaufbau (Anrede, Einleitung, Reihenfolge der Inhaltspunkte, Schluss).","model":{"label":"E-Mail an eine Freundin, ca. 95 Wörter","text":"Betreff: Ich hab’s geschafft!\n\nLiebe Sara,\n\nstell dir vor: Seit Donnerstag habe ich meinen Führerschein! Die Prüfung hat ungefähr vierzig Minuten gedauert. Ich war total nervös, und beim Einparken musste ich zweimal korrigieren. Der Prüfer war aber sehr freundlich und hat am Ende gesagt, dass ich ruhig und sicher fahre.\n\nFür mich ist der Führerschein wichtig, weil ich ab Januar in einer Firma am Stadtrand arbeite. Mit dem Bus bräuchte ich jeden Tag über eine Stunde pro Strecke.\n\nHast du Lust, im Frühling mit mir an die Ostsee zu fahren? Ich hole dich ab, und du bist meine erste Beifahrerin!\n\nLiebe Grüße\nTomasz"},"typicalErrors":"Leitpunkt 2 wird nur beschrieben, nicht begründet · Vorschlag ohne Ziel oder Zeitpunkt · Sie statt du."},{"no":2,"minutes":25,"words":80,"situation":["Sie haben im Fernsehen eine Sendung zum Thema „Mit Mitte zwanzig noch bei den Eltern wohnen?“ gesehen. Im Online-Gästebuch der Sendung finden Sie folgende Meinung:"],"points":[],"post":{"site":"www.tv-familienforum.de","label":"Gästebuch","author":"Leon · 22.10. 19:47 Uhr","text":"Ich bin 26 und wohne noch bei meinen Eltern. So kann ich Geld für eine eigene Wohnung sparen, und meine Mutter freut sich, dass sie abends nicht allein isst. Aber manchmal nervt es schon: Freunde einladen ist schwierig, und meine Eltern wollen immer wissen, wann ich nach Hause komme."},"instruction":"Schreiben Sie nun Ihre Meinung zum Thema (circa 80 Wörter).","model":{"label":"Diskussionsbeitrag, ca. 95 Wörter","text":"Leon beschreibt eine Situation, die viele junge Leute kennen. Ich finde es verständlich, bei den Eltern zu wohnen, solange man studiert oder eine Ausbildung macht. Die Mieten in den Städten sind hoch, und so kann man Geld sparen.\n\nTrotzdem bin ich der Meinung, dass man mit Mitte zwanzig ausziehen sollte. Wer allein wohnt, lernt, selbst zu kochen, Rechnungen zu bezahlen und Probleme ohne Hilfe zu lösen. Ich bin mit 21 in eine WG gezogen, und das war eine meiner besten Entscheidungen.\n\nWichtig ist aber in jedem Fall, dass man sich gegenseitig respektiert – egal, wo man wohnt."},"typicalErrors":"Leons Beitrag nur zusammenfassen, statt eine eigene Meinung zu schreiben · keine Begründung, keine Beispiele · deutlich unter 80 Wörtern."},{"no":3,"minutes":15,"words":40,"situation":["Ihre Chefin, Frau Albrecht, hat Sie gebeten, am kommenden Samstag zu arbeiten, weil ein Kollege krank ist. Sie haben an diesem Tag aber schon etwas anderes vor."],"points":[],"post":null,"instruction":"Schreiben Sie an Frau Albrecht. Entschuldigen Sie sich höflich, nennen Sie den Grund und machen Sie einen anderen Vorschlag. Schreiben Sie eine E-Mail (circa 40 Wörter). Vergessen Sie nicht die Anrede und den Gruß am Schluss.","model":{"label":"E-Mail an die Chefin, ca. 45 Wörter","text":"Sehr geehrte Frau Albrecht,\n\nleider kann ich am Samstag nicht arbeiten, weil meine Schwester an diesem Tag heiratet und ich ihre Trauzeugin bin. Das tut mir sehr leid. Ich könnte aber am Freitag zwei Stunden länger bleiben oder den Dienst am Samstag darauf übernehmen. Wäre das für Sie in Ordnung?\n\nMit freundlichen Grüßen\nNadia Haddad"},"typicalErrors":"Kein Gegenvorschlag · Hallo Frau Albrecht oder Liebe Grüße gegenüber der Chefin · keine Entschuldigung."}]},"audio":[{"src":"Goethe%20B1%20Modelltest%204.1.mp3","dur":715.02},{"src":"Goethe%20B1%20Modelltest%204.2.mp3","dur":272.88},{"src":"Goethe%20B1%20Modelltest%204.3.mp3","dur":283.72},{"src":"Goethe%20B1%20Modelltest%204.4.mp3","dur":619.76}],"pdf":"Goethe%20B1%20Modelltest%204.pdf","pages":{"loesung":17,"muster":18,"kommentar":20,"hoertexte":22}},"5":{"id":5,"roman":"V","lesen":{"t1":{"instruction":"Lesen Sie den Text und die Aufgaben 1 bis 6 dazu. Wählen Sie: Sind die Aussagen Richtig oder Falsch?","blog":{"site":"unser-altbau.de · Sabine","date":"Mittwoch, 12. Juni","title":"Land unter","paragraphs":["Seit Freitag weiß ich, wie schnell aus einem ganz normalen Abend ein Albtraum werden kann. Jan hatte Nachtschicht am Flughafen, ich war mit Lotta allein zu Hause. Gegen neun fing es an zu regnen, und zwar so stark, dass man die Straße nicht mehr sehen konnte. Eine halbe Stunde später hörte ich im Keller ein Plätschern: Durch das Fenster der Waschküche lief das Wasser herein wie aus einem Wasserhahn.","Natürlich wollte ich sofort die Feuerwehr rufen, aber unter der Notrufnummer kam ich nicht durch – an diesem Abend standen im ganzen Viertel die Keller unter Wasser. Gerettet hat uns Herr Adler von gegenüber. Er war früher Installateur und hat eine Pumpe im Schuppen. Um zehn stand er in Gummistiefeln in unserer Waschküche, und bis Mitternacht hatten wir das meiste Wasser draußen. Die Feuerwehr kam erst gegen eins und hat den Rest erledigt.","Die Waschmaschine hat überlebt, die alte Gefriertruhe nicht. Am meisten Sorgen habe ich mir um eine Kiste gemacht, die auf dem Boden stand: Darin lagen die Fotoalben meiner Großeltern. Ich habe die ganze Nacht nasse Seiten vorsichtig voneinander gelöst und mit dem Föhn getrocknet. Lotta hat mir bis zwei Uhr geholfen und dabei mehr über ihre Urgroßeltern erfahren als in all den Jahren davor. Bis auf ein paar Bilder ist alles noch gut zu erkennen.","Am Montag kam dann der nächste Schreck: Unsere Versicherung zahlt nichts. Schäden durch Starkregen waren in unserem Vertrag gar nicht enthalten – das stand im Kleingedruckten, das natürlich niemand liest. Die Mitarbeiterin am Telefon war zwar sehr freundlich, aber das hilft uns jetzt auch nicht weiter. Die Truhe bezahlen wir also selbst. Den Vertrag haben wir noch am selben Tag erweitert; teurer ist er dadurch nur um ein paar Euro im Monat.","Und sonst? Im Keller kommt jetzt alles in Regale, nichts steht mehr auf dem Boden, und die Fotoalben stehen ab sofort im Wohnzimmer. In der Nachbarschaftsgruppe warnen wir uns inzwischen gegenseitig, wenn ein Unwetter angesagt ist. Herr Adler hat eine Flasche Wein bekommen und eine Einladung zum Grillen – sobald es aufhört zu regnen."],"closing":"Eure Sabine"},"example":{"no":"0","text":"Sabines Keller stand nach einem Unwetter unter Wasser.","answer":"R"},"items":[{"no":"1","text":"Sabine war während des Unwetters allein im Haus.","answer":"F"},{"no":"2","text":"Bevor die Feuerwehr kam, war schon ein Großteil des Wassers weg.","answer":"R"},{"no":"3","text":"Die meisten alten Fotos sind nicht verloren.","answer":"R"},{"no":"4","text":"Den Schaden an der Gefriertruhe übernimmt die Versicherung.","answer":"F"},{"no":"5","text":"Für ihren neuen Versicherungsschutz zahlt die Familie jetzt etwas mehr.","answer":"R"},{"no":"6","text":"Sabine will ihren Keller künftig nicht mehr nutzen.","answer":"F"}]},"t2":{"texts":[{"instruction":"Lesen Sie den Text aus der Presse und die Aufgaben 7 bis 9 dazu. Wählen Sie bei jeder Aufgabe die richtige Lösung a, b oder c.","title":"Schwimmen lernen mit vierzig","lead":"Das Hallenbad in Lindenau bietet Kurse für Erwachsene an, die nie schwimmen gelernt haben.","paragraphs":["Der Kurs beginnt erst, wenn es draußen dunkel ist: Dienstags um 20 Uhr, wenn im Hallenbad von Lindenau keine Schulklassen und Vereine mehr trainieren, startet „Keine Angst vor Wasser“. Zehn Erwachsene zwischen 25 und 68 Jahren stehen dann im flachen Becken – Menschen, die als Kinder nie schwimmen gelernt haben. „Viele schämen sich so sehr, dass sie jahrelang nicht einmal im Urlaub an den Strand gegangen sind“, sagt Kursleiterin Petra Wolff. Deshalb bleibt die Halle während des Kurses für andere Gäste geschlossen, und niemand schaut vom Rand aus zu. Die ersten beiden Abende verbringen die Teilnehmer nur damit, sich an das Wasser zu gewöhnen: das Gesicht eintauchen, ausatmen, sich treiben lassen. Erst in der vierten Woche geht es ins tiefe Becken. Einige Teilnehmer haben inzwischen sogar das „Seepferdchen“ gemacht – das Abzeichen, das sonst Fünfjährige bekommen. Der Kurs dauert zehn Wochen und kostet 90 Euro; wer ein geringes Einkommen hat, zahlt die Hälfte. Die Stadt hatte das Angebot vor drei Jahren eigentlich nur für Geflüchtete geplant. Inzwischen kommen aber vor allem Menschen, die hier aufgewachsen sind und sich bisher nicht getraut haben. Die Nachfrage ist so groß, dass man fast ein Jahr auf einen Platz wartet. Wolff sucht deshalb weitere Trainerinnen und Trainer. Ab Herbst soll es außerdem einen Kurs nur für Frauen geben – am Sonntagvormittag, mit Kinderbetreuung im Nebenraum."],"footnote":"","source":"aus einer deutschen Zeitung","example":{"no":"0","stem":"Der Kurs findet …","options":{"a":"morgens statt.","b":"am Abend statt.","c":"am Wochenende statt."},"answer":"b"},"items":[{"no":"7","stem":"In diesem Text geht es um …","options":{"a":"Kinder, die in der Schule schwimmen lernen.","b":"Erwachsene, die spät schwimmen lernen.","c":"ein Hallenbad, das neue Trainer ausbildet."},"answer":"b"},{"no":"8","stem":"Während des Kurses …","options":{"a":"dürfen Angehörige am Beckenrand zuschauen.","b":"üben die Teilnehmer von Anfang an im tiefen Wasser.","c":"ist das Bad für andere Besucher nicht zugänglich."},"answer":"c"},{"no":"9","stem":"Das Angebot …","options":{"a":"war ursprünglich für eine andere Gruppe gedacht.","b":"ist für Menschen mit wenig Geld kostenlos.","c":"soll im Herbst durch einen weiteren Abendkurs ergänzt werden."},"answer":"a"}]},{"instruction":"Lesen Sie den Text aus der Presse und die Aufgaben 10 bis 12 dazu. Wählen Sie bei jeder Aufgabe die richtige Lösung a, b oder c.","title":"Zu Fuss statt im Elterntaxi","lead":"In Uster bringen Eltern die Kinder als „Pedibus“ zur Schule – ganz ohne Auto.","paragraphs":["Jeden Morgen um 7.40 Uhr steht Marco Frei mit einer gelben Leuchtweste an der Haltestelle Grüningerstrasse – einen Bus erwartet er aber nicht. Er wartet auf sieben Kinder zwischen fünf und acht Jahren, die er zu Fuss in den Kindergarten und in die Primarschule begleitet. Der „Pedibus“ funktioniert wie ein Linienbus: Es gibt einen Fahrplan, feste Haltestellen und eine Route, die die Eltern mit der Polizei abgesprochen haben. Nur die „Fahrer“ sind Mütter, Väter oder Grosseltern, die sich abwechseln; jeder übernimmt etwa einen Morgen pro Woche. Entstanden ist die Idee, weil vor dem Schulhaus jeden Morgen Chaos herrschte: Eltern hielten mit ihren Autos auf dem Trottoir*, um die Kinder aussteigen zu lassen. „Ausgerechnet für die Kinder, die zu Fuss kamen, wurde es dadurch gefährlich“, sagt Schulleiterin Ruth Brunner. Heute gibt es in Uster vier Linien, und am Schultor ist es deutlich ruhiger geworden. Unterwegs lernen die Kinder, wie man eine Strasse sicher überquert; nach einem Jahr dürfen viele den Weg allein gehen. Die Eltern berichten ausserdem, dass die Kinder wacher im Unterricht sitzen, seit sie morgens zwanzig Minuten an der frischen Luft sind. Kosten entstehen kaum: Die Westen hat die Gemeinde bezahlt. Schwierig wird es nur im Winter, wenn Eltern krank sind und niemand einspringt. Für solche Fälle sucht die Schule jetzt Freiwillige aus dem Quartier, die kurzfristig helfen können."],"footnote":"*Trottoir = Schweizer Standard für „Gehweg“","source":"aus einer Schweizer Zeitung","example":null,"items":[{"no":"10","stem":"In diesem Text geht es um …","options":{"a":"Kinder, die mit einem Schulbus fahren.","b":"eine Schule, die Autos vor dem Eingang verbietet.","c":"Eltern, die Kinder gemeinsam zu Fuß zur Schule bringen."},"answer":"c"},{"no":"11","stem":"Die Begleiterinnen und Begleiter …","options":{"a":"teilen sich die Aufgabe untereinander auf.","b":"werden für ihre Arbeit von der Gemeinde bezahlt.","c":"sind an jedem Morgen der Woche dieselben Personen."},"answer":"a"},{"no":"12","stem":"Probleme gibt es vor allem, wenn …","options":{"a":"die Kinder allein zur Schule gehen wollen.","b":"im Winter Begleitpersonen ausfallen.","c":"die Polizei die Route ändert."},"answer":"b"}]}]},"t3":{"instruction":"Lesen Sie die Situationen 13 bis 19 und die Anzeigen a bis j aus verschiedenen deutschsprachigen Medien. Wählen Sie: Welche Anzeige passt zu welcher Situation? Sie können jede Anzeige nur einmal verwenden. Die Anzeige aus dem Beispiel können Sie nicht mehr verwenden. Für eine Situation gibt es keine passende Anzeige. In diesem Fall schreiben Sie 0.","context":"Einige Ihrer Freunde und Bekannten planen einen Urlaub oder eine Reise und suchen ein passendes Angebot.","example":{"no":"0","text":"Familie Roth möchte mit ihrem Hund Urlaub an der Nordsee machen.","answer":"b"},"items":[{"no":"13","text":"Herr und Frau Weiß sind über siebzig. Sie möchten gern mit dem Rad reisen, ihre Koffer aber nicht selbst tragen.","answer":"e"},{"no":"14","text":"Clara ist 34 und möchte ihr Spanisch verbessern. Am liebsten würde sie bei Einheimischen wohnen.","answer":"h"},{"no":"15","text":"Tobias hat nur ein langes Wochenende frei. Er möchte in die Berge, besitzt aber kein Auto.","answer":"c"},{"no":"16","text":"Familie Özdemir sucht für die Sommerferien einen Campingplatz, auf dem ihre beiden Kinder (6 und 9) etwas erleben können.","answer":"0"},{"no":"17","text":"Frau Lange ist auf einen Rollstuhl angewiesen und möchte ein paar Tage eine Stadt besichtigen.","answer":"j"},{"no":"18","text":"Nils möchte seinen Urlaub nutzen, um sich für die Natur einzusetzen.","answer":"f"},{"no":"19","text":"Herr Albers hat nur wenig Geld, möchte aber trotzdem ein paar Tage ans Meer.","answer":"a"}],"ads":[{"letter":"a","header":"","tag":"ab 19 € PRO NACHT","title":"Grüße von der Ostsee!","subtitle":"","facts":[],"body":["Übernachten im Strandhostel Warnemünde: Mehrbettzimmer ab 19 € pro Nacht, Doppelzimmer ab 48 €. Frühstück 6 €, Gästeküche zur Selbstversorgung. Für Gäste jeden Alters, ohne Mitgliedsausweis. Zum Strand sind es drei Minuten."],"footer":"strandhostel-warnemuende.de"},{"letter":"b","header":"SANKT PETER-ORDING · NORDSEE","tag":"ab 140 € pro Nacht","title":"Ferienhaus Dünenblick","subtitle":"","facts":["Mindestaufenthalt eine Woche","Endreinigung inklusive"],"body":["Reetdachhaus für bis zu sechs Personen, 300 Meter hinter dem Deich, mit eingezäuntem Garten. Hunde sind bei uns herzlich willkommen – der Hundestrand liegt gleich um die Ecke."],"footer":""},{"letter":"c","header":"","tag":"FR – MO","title":"Bahnwochenende Allgäu","subtitle":"","facts":["Fr 16.08 München Hbf → Oberstdorf 18.40","Mo 17.20 Oberstdorf → München Hbf 19.52","289 € pro Person"],"body":["In die Berge – ganz ohne Auto: Hin- und Rückfahrt mit dem Zug ab jedem Bahnhof in Bayern, drei Nächte in der Berghütte „Edelweiß“ mit Halbpension und eine geführte Wanderung."],"footer":""},{"letter":"d","header":"","tag":"12 TAGE","title":"Nordland-Kreuzfahrt","subtitle":"","facts":[],"body":["Entlang der norwegischen Küste – Fjorde, Gletscher und Mitternachtssonne. Außenkabine, Vollpension und Landausflüge inklusive. Ab 2.490 € pro Person; wer bis 31. März bucht, spart zehn Prozent."],"footer":"Reederei Polaris · 040 / 77 88 99"},{"letter":"e","header":"","tag":"8 TAGE","title":"Elbe-Radreisen","subtitle":"","facts":["Dresden – Meißen – Torgau – Wittenberg"],"body":["Täglich 40 bis 60 Kilometer auf flachen Radwegen. Ihr Gepäck bringen wir jeden Morgen ins nächste Hotel – Sie fahren nur mit einer kleinen Tasche. E-Bikes gegen Aufpreis. Besonders beliebt bei Gästen ab 60."],"footer":"elbe-radreisen.de"},{"letter":"f","header":"","tag":"","title":"Nationalpark Harz sucht Helfer","subtitle":"","facts":[],"body":["Ein Urlaub, der etwas bewirkt: Mit unseren Rangern reparieren Sie Wanderwege, pflanzen junge Bäume und zählen Vögel. Unterkunft und Essen sind kostenlos, die Anreise zahlen Sie selbst. Voraussetzung: Sie sind mindestens 18 und gut zu Fuß."],"footer":"Infos im Besucherzentrum Torfhaus"},{"letter":"g","header":"","tag":"","title":"RUHE","subtitle":"CAMPINGPLATZ SEEBLICK","facts":[],"body":["Bei uns gibt es keinen Spielplatz und keine Animation – dafür Stille, einen Saunasteg und Stellplätze direkt am Wasser. Bitte beachten Sie: Kinder und Jugendliche unter 16 Jahren können wir leider nicht aufnehmen."],"footer":"camping-seeblick.de"},{"letter":"h","header":"SPRACHREISEN SOL","tag":"SALAMANCA","title":"","subtitle":"","facts":[],"body":["Spanisch lernen, wo es gesprochen wird: Unterricht in kleinen Gruppen, vier Stunden am Vormittag, für Erwachsene aller Niveaus. Sie wohnen bei einer spanischen Gastfamilie mit Frühstück und Abendessen – so sprechen Sie auch nach dem Unterricht Spanisch."],"footer":"Ab zwei Wochen buchbar · sprachreisen-sol.de"},{"letter":"i","header":"","tag":"","title":"Sprachcamp Costa Brava","subtitle":"FÜR JUGENDLICHE VON 12 BIS 17 JAHREN","facts":[],"body":["Zwei Wochen Zeltlager am Meer: morgens Spanischunterricht, nachmittags Surfen, Klettern und Ausflüge. Erfahrene Teamer betreuen die Gruppe rund um die Uhr. Anreise im Reisebus ab Köln."],"footer":"Jugendreisen Mar · Frühbucherrabatt bis 30. April"},{"letter":"j","header":"","tag":"","title":"Dresden ohne Hindernisse","subtitle":"","facts":[],"body":["Städtereise für Rollstuhlfahrerinnen und Rollstuhlfahrer: zwei Nächte im Hotel „Elbufer“ mit rollstuhlgerechten Zimmern und Bädern, eine Stadtführung auf stufenlosen Wegen und ein Opernabend mit reservierten Rollstuhlplätzen. Begleitpersonen erhalten 30 Prozent Rabatt."],"footer":"Reisebüro Weitblick · 0351 / 40 50 60"}]},"t4":{"instruction":"Lesen Sie die Texte 20 bis 26. Wählen Sie: Ist die Person für einen fleischfreien Tag in Kantinen, Ja oder Nein?","context":"In einer Zeitschrift lesen Sie Kommentare zu einem Artikel über Firmen und Schulen, deren Kantinen einmal pro Woche kein Fleisch mehr anbieten.","header":"LESERKOMMENTARE","site":"www.essen-und-arbeit.de/forum","example":{"no":"0","name":"Katrin","byline":"Katrin, 52, Mainz","text":"In unserer Kantine gibt es seit einem Jahr jeden Donnerstag nur Gerichte ohne Fleisch. Am Anfang wurde gemeckert, heute ist der Donnerstag der Tag mit den meisten Gästen. Die Köche geben sich mehr Mühe, und ich habe Gerichte kennengelernt, die ich jetzt zu Hause selbst koche. Ein Tag in der Woche tut niemandem weh – dem Klima aber gut.","answer":"J"},"items":[{"no":"20","name":"Bernd","byline":"Bernd, 58, Essen","text":"Ich verstehe ja, dass viele weniger Fleisch essen wollen, und das ist auch in Ordnung. Aber ich arbeite auf dem Bau, und mittags brauche ich etwas Ordentliches. Die Kantine ist für viele von uns die einzige warme Mahlzeit am Tag. Wer kein Fleisch will, soll eben das Gemüse nehmen – mir sollte aber niemand vorschreiben, was auf meinen Teller kommt.","answer":"N"},{"no":"21","name":"Selin","byline":"Selin, 27, Wien","text":"Bei uns in der Firma wird jeden Mittwoch vegetarisch gekocht, und seitdem sitze ich mittags endlich mit meinen Kollegen an einem Tisch, statt mir einen Salat mitzubringen. Ich esse seit Jahren kein Fleisch. Dass die anderen einmal pro Woche probieren, was ich jeden Tag esse, finde ich nur fair. Und ehrlich gesagt: Die meisten merken gar nicht, dass etwas fehlt.","answer":"J"},{"no":"22","name":"Thomas","byline":"Thomas, 44, Zürich","text":"Als die Schule meiner Tochter den Veggie-Tag eingeführt hat, habe ich mich beim Elternabend darüber beschwert. Ein Kind braucht Fleisch, dachte ich. Dann hat uns die Köchin zum Probeessen eingeladen: Linsencurry, Gemüselasagne, Käsespätzle. Meine Tochter hat zweimal nachgenommen – ich übrigens auch. Seitdem sehe ich das entspannter und würde mir so einen Tag auch in meiner Firma wünschen.","answer":"J"},{"no":"23","name":"Yvonne","byline":"Yvonne, 36, Bremen","text":"Meine Kinder erzählen begeistert vom Veggie-Tag in der
