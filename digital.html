 Schule, und meine Nachbarin hält ihn für eine tolle Idee. Ich sehe das anders. Mein Sohn isst ohnehin kaum Gemüse; an diesen Tagen kommt er hungrig nach Hause, weil er sein Essen stehen lässt. Die Schule sollte die Kinder lieber für gesundes Essen begeistern, statt ihnen etwas zu verbieten.","answer":"N"},{"no":"24","name":"Ahmet","byline":"Ahmet, 49, Nürnberg","text":"Ich bin nur dafür, wenn das vegetarische Essen genauso satt macht und nicht teurer ist als die Fleischgerichte. Sonst gehen die Leute einfach zur Imbissbude gegenüber. In unserer Kantine klappt das: Freitags gibt es Eintöpfe mit Bohnen oder Linsen für 4,50 Euro, und die Schlange ist so lang wie an anderen Tagen. So kann es bleiben.","answer":"J"},{"no":"25","name":"Laura","byline":"Laura, 31, Linz","text":"Warum muss man den Leuten etwas wegnehmen? Viel besser fände ich es, wenn es jeden Tag ein richtig gutes vegetarisches Gericht gäbe – günstiger als das Schnitzel und gleich am Anfang der Theke. Dann greifen die meisten von allein zu, das hat man an unserer Uni schon ausprobiert. Ein fester Tag ohne Fleisch sorgt dagegen nur für schlechte Laune.","answer":"N"},{"no":"26","name":"Klaus","byline":"Klaus, 63, Rostock","text":"Grundsätzlich hätte ich nichts dagegen, wenn die Qualität stimmen würde. Aber in unserer Betriebskantine gibt es am fleischfreien Montag immer dasselbe: zerkochte Nudeln mit Tomatensoße, und das seit zwei Jahren. Kein Wunder, dass montags die Hälfte der Tische leer bleibt. Solange dem Koch nicht mehr einfällt, ist so ein Tag nur ärgerlich. Ich bringe mir montags inzwischen ein Brot von zu Hause mit.","answer":"N"}]},"t5":{"instruction":"Lesen Sie die Aufgaben 27 bis 30 und den Text dazu. Wählen Sie bei jeder Aufgabe die richtige Lösung a, b oder c.","context":"Sie möchten ein Carsharing-Angebot nutzen und lesen die Nutzungsbedingungen.","doc":{"title":"NUTZUNGSBEDINGUNGEN · STADTAUTO","intro":"","sections":[{"heading":"Anmeldung","text":"Kundin oder Kunde kann werden, wer mindestens 21 Jahre alt ist und seit mindestens zwei Jahren einen gültigen Führerschein besitzt. Die Anmeldung erfolgt online; Führerschein und Personalausweis zeigen Sie einmalig in einer unserer Filialen vor. Die Aufnahmegebühr beträgt 30 Euro."},{"heading":"Buchung","text":"Fahrzeuge können Sie über die App oder telefonisch bis zu vier Wochen im Voraus reservieren. Bis eine Stunde vor Fahrtbeginn können Sie eine Buchung kostenlos stornieren; danach berechnen wir die Hälfte des Preises. Kindersitze können Sie kostenlos dazubuchen."},{"heading":"Kosten","text":"Abgerechnet wird nach Zeit und gefahrenen Kilometern. Versicherung und Kraftstoff sind im Preis enthalten. Ist der Tank weniger als ein Viertel voll, tanken Sie bitte mit der Tankkarte aus dem Handschuhfach; dafür schreiben wir Ihnen zehn Minuten Fahrzeit gut."},{"heading":"Rückgabe","text":"Bringen Sie das Fahrzeug pünktlich an den Stellplatz zurück, an dem Sie es abgeholt haben. Bei Verspätung ohne vorherigen Anruf berechnen wir 15 Euro pro angefangene halbe Stunde."},{"heading":"Schäden und Sauberkeit","text":"Melden Sie Schäden vor Fahrtbeginn über die App; sonst müssen wir davon ausgehen, dass Sie sie verursacht haben. Rauchen ist in allen Fahrzeugen verboten. Tiere dürfen nur in einer Transportbox mitfahren."},{"heading":"Kündigung","text":"Die Mitgliedschaft kann jederzeit mit einer Frist von vier Wochen zum Monatsende gekündigt werden. Der Monatsbeitrag von 9 Euro entfällt für Kundinnen und Kunden, die ein Jahresabo für Bus und Bahn besitzen."},{"heading":"Weitere Fahrer","text":"Das Fahrzeug dürfen nur angemeldete Kundinnen und Kunden fahren. Personen, die im selben Haushalt leben, können sich kostenlos als Zusatzfahrer registrieren lassen."}],"footer":""},"example":null,"items":[{"no":"27","stem":"Wer seit einem Jahr einen Führerschein hat, …","options":{"a":"kann sich nur in einer Filiale anmelden.","b":"kann noch nicht Kunde werden.","c":"zahlt eine höhere Aufnahmegebühr."},"answer":"b"},{"no":"28","stem":"Wer eine Buchung 30 Minuten vor Fahrtbeginn absagt, …","options":{"a":"hat keine zusätzlichen Kosten.","b":"darf in den nächsten vier Wochen nichts mehr buchen.","c":"muss einen Teil des Preises bezahlen."},"answer":"c"},{"no":"29","stem":"Wenn der Tank fast leer ist, …","options":{"a":"bekommt man fürs Tanken einen kleinen Bonus.","b":"zahlt man das Benzin zunächst selbst.","c":"muss man das Auto sofort zurückbringen."},"answer":"a"},{"no":"30","stem":"Der Mann einer Kundin, der mit ihr zusammenwohnt, …","options":{"a":"darf das Auto ohne Anmeldung fahren.","b":"muss erst selbst eine Aufnahmegebühr von 30 Euro bezahlen.","c":"kann sich kostenlos als Fahrer eintragen lassen."},"answer":"c"}]}},"hoeren":{"t1":{"instruction":"Sie hören nun fünf kurze Texte. Sie hören jeden Text zweimal. Zu jedem Text lösen Sie zwei Aufgaben. Wählen Sie bei jeder Aufgabe die richtige Lösung.","readNote":"Lesen Sie zuerst das Beispiel. Dazu haben Sie 10 Sekunden Zeit.","example":[{"no":"01","type":"rf","text":"Frau Scholl kann ihre Katze heute abholen.","answer":"R"},{"no":"02","type":"abc","stem":"Frau Scholl soll …","options":{"a":"den Transportkorb mitbringen.","b":"die Tabletten in der Apotheke kaufen.","c":"morgen früh in der Praxis anrufen."},"answer":"a"}],"texts":[{"label":"Text 1","items":[{"no":"1","type":"rf","text":"Die Fans müssen heute ein anderes Verkehrsmittel nehmen als sonst.","answer":"R"},{"no":"2","type":"abc","stem":"Die Ersatzbusse …","options":{"a":"fahren wie die Straßenbahn am Ausgang Süd ab.","b":"sind für Besucher mit Eintrittskarte kostenlos.","c":"bringen die Fans direkt zu den Parkplätzen am Stadion."},"answer":"b"}]},{"label":"Text 2","items":[{"no":"3","type":"rf","text":"Heute Abend kann Frau Brenner das Paket von Herrn Wolf selbst bekommen.","answer":"F"},{"no":"4","type":"abc","stem":"Frau Brenner soll das Paket …","options":{"a":"in einer Woche bei Familie Wolf abholen.","b":"beim Paketdienst in der Filiale abholen.","c":"noch heute bei Frau Wolf abholen."},"answer":"c"}]},{"label":"Text 3","items":[{"no":"5","type":"rf","text":"In dieser Woche wird der Müll überall einen Tag später abgeholt.","answer":"F"},{"no":"6","type":"abc","stem":"Die Wertstoffhöfe …","options":{"a":"haben am Samstag länger geöffnet als sonst.","b":"sind in dieser Woche ganz geschlossen.","c":"öffnen am Donnerstag erst um 6 Uhr."},"answer":"a"}]},{"label":"Text 4","items":[{"no":"7","type":"rf","text":"Jemand hat eine gefundene Tasche abgegeben.","answer":"R"},{"no":"8","type":"abc","stem":"Heute Abend …","options":{"a":"wird das Konzert verschoben.","b":"fällt ein Programmpunkt aus.","c":"schließt der Infostand früher."},"answer":"b"}]},{"label":"Text 5","items":[{"no":"9","type":"rf","text":"Der Kurs beginnt ab nächster Woche zu einer anderen Uhrzeit.","answer":"F"},{"no":"10","type":"abc","stem":"Herr Kowalczyk soll …","options":{"a":"sich im Büro der Sprachschule noch einmal neu anmelden.","b":"im Kurs den Aufzug benutzen.","c":"ein Formular unterschrieben abgeben."},"answer":"c"}]}]},"t2":{"instruction":"Sie hören nun einen Text. Sie hören den Text einmal. Dazu lösen Sie fünf Aufgaben. Wählen Sie bei jeder Aufgabe die richtige Lösung a, b oder c.","readNote":"Lesen Sie jetzt die Aufgaben 11 bis 15. Dazu haben Sie 60 Sekunden Zeit.","context":"Sie nehmen an einer Führung hinter den Kulissen des Stadttheaters teil. Zu Beginn spricht die Theaterpädagogin Frau Engel.","items":[{"no":"11","stem":"Die Führung …","options":{"a":"endet auf jeden Fall auf der großen Bühne des Theaters.","b":"beginnt dort, wo die Bühnenbilder entstehen.","c":"dauert ungefähr eine halbe Stunde."},"answer":"b"},{"no":"12","stem":"Fotos …","options":{"a":"sind in einem Raum nicht erlaubt.","b":"darf man nur auf der Bühne machen.","c":"sind im ganzen Theater verboten."},"answer":"a"},{"no":"13","stem":"Im Kostümfundus …","options":{"a":"dürfen nur Kinder etwas anprobieren.","b":"kann man Kostüme ausleihen.","c":"darf man einzelne Stücke anziehen."},"answer":"c"},{"no":"14","stem":"Die Garderobe …","options":{"a":"kostet einen kleinen Betrag.","b":"ist für die Teilnehmenden kostenlos.","c":"befindet sich im Untergeschoss."},"answer":"b"},{"no":"15","stem":"Mit der Führungskarte …","options":{"a":"kann man im Internet günstigere Karten für diesen Monat kaufen.","b":"sieht man die Vorstellung heute Abend kostenlos.","c":"zahlt man für Theaterkarten an der Kasse weniger."},"answer":"c"}]},"t3":{"instruction":"Sie hören nun ein Gespräch. Sie hören das Gespräch einmal. Dazu lösen Sie sieben Aufgaben. Wählen Sie: Sind die Aussagen Richtig oder Falsch?","readNote":"Lesen Sie jetzt die Aufgaben 16 bis 22. Dazu haben Sie 60 Sekunden Zeit.","context":"Sie sind in der Kantine und hören, wie sich zwei Kolleginnen, Birte und Anja, in der Mittagspause unterhalten.","items":[{"no":"16","text":"Birte fährt inzwischen meistens mit dem Rad zur Arbeit.","answer":"R"},{"no":"17","text":"Das E-Bike hat Birte selbst bezahlt.","answer":"F"},{"no":"18","text":"Mit dem Rad braucht Birte länger als früher mit dem Auto.","answer":"F"},{"no":"19","text":"Am Anfang war Haruka in der Familie sehr zurückhaltend.","answer":"R"},{"no":"20","text":"Anjas Sohn war von der Gastschülerin zunächst nicht begeistert.","answer":"R"},{"no":"21","text":"Haruka darf ihren Aufenthalt verlängern.","answer":"F"},{"no":"22","text":"Anjas Familie plant, Haruka in Japan zu besuchen.","answer":"R"}]},"t4":{"instruction":"Sie hören nun eine Diskussion. Sie hören die Diskussion zweimal. Dazu lösen Sie acht Aufgaben. Ordnen Sie die Aussagen zu: Wer sagt was?","readNote":"Lesen Sie jetzt die Aussagen 23 bis 30. Dazu haben Sie 60 Sekunden Zeit.","context":"Der Moderator der Radiosendung „Standpunkte“ diskutiert mit der Grundschullehrerin Claudia Reuter und dem Vater und Elternvertreter Martin Kühne über die Frage: „Sollen Hausaufgaben abgeschafft werden?“","speakers":{"a":"Moderator","b":"Claudia Reuter","c":"Martin Kühne"},"example":{"no":"0","text":"An vielen Schulen wird über Hausaufgaben diskutiert.","answer":"a"},"items":[{"no":"23","text":"Was früher zu Hause geübt wurde, üben die Kinder jetzt im Unterricht.","answer":"b"},{"no":"24","text":"Hausaufgaben zeigen Eltern, womit sich ihr Kind gerade beschäftigt.","answer":"c"},{"no":"25","text":"Nicht alle Kinder bekommen zu Hause Unterstützung.","answer":"a"},{"no":"26","text":"Ohne Hausaufgaben ist das Familienleben entspannter.","answer":"b"},{"no":"27","text":"Lernstoff muss man oft wiederholen, damit man ihn behält.","answer":"c"},{"no":"28","text":"Für Hausaufgaben sollte es eine feste Zeitgrenze geben.","answer":"c"},{"no":"29","text":"Auf die Noten jüngerer Kinder haben Hausaufgaben wenig Wirkung.","answer":"a"},{"no":"30","text":"Auch die Lehrkräfte profitieren davon, dass es keine Hausaufgaben mehr gibt.","answer":"b"}]}},"schreiben":{"intro":"Das Modul Schreiben besteht aus drei Teilen. In den Aufgaben 1 und 3 schreiben Sie E-Mails, in Aufgabe 2 schreiben Sie einen Diskussionsbeitrag. Sie können mit jeder Aufgabe beginnen. Schreiben Sie Ihre Texte auf den Antwortbogen.","tasks":[{"no":1,"minutes":20,"words":80,"situation":["Sie haben am Wochenende Ihren 30. Geburtstag gefeiert. Ein Freund/Eine Freundin von Ihnen konnte leider nicht kommen, weil er/sie krank war."],"points":["Beschreiben Sie: Wie war die Feier?","Begründen Sie: Welches Geschenk hat Ihnen am besten gefallen und warum?","Machen Sie einen Vorschlag, wie Sie beide nachfeiern können."],"post":null,"instruction":"Schreiben Sie eine E-Mail (circa 80 Wörter). Schreiben Sie etwas zu allen drei Punkten. Achten Sie auf den Textaufbau (Anrede, Einleitung, Reihenfolge der Inhaltspunkte, Schluss).","model":{"label":"E-Mail an einen Freund, ca. 95 Wörter","text":"Betreff: Schade, dass du nicht da warst!\n\nLieber Markus,\n\nwie geht es dir? Ich hoffe, du bist wieder gesund! Meine Geburtstagsfeier am Samstag war wunderschön. Wir waren ungefähr zwanzig Leute in meinem Garten, haben gegrillt und bis zwei Uhr nachts getanzt.\n\nAm besten hat mir das Geschenk meiner Schwester gefallen: ein Fotobuch mit Bildern aus dreißig Jahren. Beim Anschauen habe ich gleichzeitig gelacht und geweint, weil ich so viele Erinnerungen wiedergefunden habe.\n\nWollen wir nächsten Samstag zusammen essen gehen und ein bisschen nachfeiern? Ich lade dich ein – such dir ein Restaurant aus!\n\nViele Grüße\nLucía"},"typicalErrors":"Das Geschenk wird nur genannt, nicht begründet · Vorschlag ohne Zeitpunkt · Sie statt du."},{"no":2,"minutes":25,"words":80,"situation":["Sie haben im Radio eine Sendung zum Thema „Ausbildung statt Studium?“ gehört. Im Online-Gästebuch der Sendung finden Sie folgende Meinung:"],"points":[],"post":{"site":"www.radio-bildung.de","label":"Gästebuch","author":"Petra · 08.02. 20:14 Uhr","text":"Mein Sohn hat ein sehr gutes Abitur und will trotzdem Tischler werden. Ich verstehe das nicht ganz – mit einem Studium hätte er später bessere Chancen. Andererseits ist er in der Werkstatt so glücklich, wie er es in der Schule nie war. Und Handwerker werden überall gesucht."},"instruction":"Schreiben Sie nun Ihre Meinung zum Thema (circa 80 Wörter).","model":{"label":"Diskussionsbeitrag, ca. 95 Wörter","text":"Petra spricht ein wichtiges Thema an. Ich finde, ein Studium ist nicht für jeden der richtige Weg. Wer gern mit den Händen arbeitet, ist in einer Ausbildung oft glücklicher, und das ist genauso viel wert wie ein Abschluss an der Universität.\n\nAußerdem haben Handwerker heute sehr gute Chancen: Sie finden schnell eine Stelle und können sich später selbstständig machen. Mein Cousin ist Elektriker und verdient mehr als viele seiner Freunde mit Studium.\n\nTrotzdem verstehe ich Petras Sorge. Ihr Sohn sollte aber wissen, dass er auch nach der Ausbildung noch studieren kann."},"typicalErrors":"Petras Beitrag nur zusammenfassen, statt eine eigene Meinung zu schreiben · keine Beispiele · deutlich unter 80 Wörtern."},{"no":3,"minutes":15,"words":40,"situation":["Sie haben sich von Ihrem Nachbarn, Herrn Keller, eine Leiter ausgeliehen. Beim Renovieren ist die Leiter kaputtgegangen."],"points":[],"post":null,"instruction":"Schreiben Sie an Herrn Keller. Entschuldigen Sie sich höflich, erklären Sie, was passiert ist, und machen Sie einen Vorschlag. Schreiben Sie eine E-Mail (circa 40 Wörter). Vergessen Sie nicht die Anrede und den Gruß am Schluss.","model":{"label":"E-Mail an den Nachbarn, ca. 45 Wörter","text":"Sehr geehrter Herr Keller,\n\nes tut mir sehr leid, aber beim Streichen ist Ihre Leiter umgefallen, und eine Stufe ist gebrochen. Ich möchte Ihnen gern eine neue Leiter kaufen. Hätten Sie am Samstag Zeit, mit mir in den Baumarkt zu fahren? Dann können Sie selbst ein Modell aussuchen.\n\nMit freundlichen Grüßen\nOmar Saleh"},"typicalErrors":"Kein Vorschlag (ersetzen, reparieren) · Hallo Herr Keller oder Liebe Grüße · keine Entschuldigung."}]},"audio":[{"src":"Goethe%20B1%20Modelltest%205.1.mp3","dur":643.19},{"src":"Goethe%20B1%20Modelltest%205.2.mp3","dur":301.17},{"src":"Goethe%20B1%20Modelltest%205.3.mp3","dur":245.58},{"src":"Goethe%20B1%20Modelltest%205.4.mp3","dur":568.84}],"pdf":"Goethe%20B1%20Modelltest%205.pdf","pages":{"loesung":17,"muster":18,"kommentar":20,"hoertexte":22}}}}</script>

  /* ---------- module models ---------- */
  function buildLesen() {
    var L = T.lesen, pages = [], items = [];
    function reg(list, type, teil, page) {
      list.forEach(function (it) { items.push({ no: it.no, type: type, answer: it.answer, teil: teil, page: page, src: it }); });
    }
    pages.push({ key: 'L1', teil: 1, title: 'Lesen Teil 1', inst: [L.t1.instruction], leftTitle: 'Text', rightTitle: 'Aufgaben 1–6',
      left: blogHTML(L.t1.blog), right: rfItem(L.t1.example, true) + L.t1.items.map(function (it) { return rfItem(it); }).join('') });
    reg(L.t1.items, 'rf', 1, 0);
    L.t2.texts.forEach(function (tx, i) {
      var nos = tx.items.map(function (it) { return it.no; });
      pages.push({ key: 'L2' + (i ? 'b' : 'a'), teil: 2, sub: i, title: 'Lesen Teil 2', inst: [tx.instruction], leftTitle: 'Text ' + (i + 1),
        rightTitle: 'Aufgaben ' + nos[0] + '–' + nos[nos.length - 1], left: articleHTML(tx),
        right: (tx.example ? abcItem(tx.example, true) : '') + tx.items.map(function (it) { return abcItem(it); }).join('') });
      reg(tx.items, 'abc', 2, pages.length - 1);
    });
    pages.push({ key: 'L3', teil: 3, title: 'Lesen Teil 3', inst: [L.t3.instruction], leftTitle: 'Anzeigen a–j', rightTitle: 'Situationen 13–19',
      left: adsHTML(L.t3.ads), right: '<p class="ctx">' + esc(L.t3.context) + '</p>' + selItem(L.t3.example, true) + L.t3.items.map(function (it) { return selItem(it); }).join('') });
    reg(L.t3.items, 'sel', 3, pages.length - 1);

    reg(L.t4.items, 'jn', 4, pages.length - 1);

  function gridHTML(t, ex) {

    h += '</tr></thead><tbody>';

      var r = '<tr class="' + (isEx ? 'ex' : '') + '" id="q-' + esc(it.no) + '"><td class="no">' + esc(it.no) + '</td><td>' + (isEx ? '<span class="bsp">Beispiel</span>' : '') + esc(it.text) + '</td>';
      ['a', 'b', 'c'].forEach(function (k) {

  function buildHoeren() {

  function taskHTML(tk) {

  function buildSchreiben() {

      started: Date.now(), audio: { track: 0, pos: 0, done: false }, font: (lsGet('font') || 0) };
  }

    var rules = {
      lesen: [
        ['Lesen Sie die Texte und lösen Sie die Aufgaben. Die Reihenfolge der Teile können Sie selbst wählen.', '지문을 읽고 문항을 풉니다. Teil 순서는 자유롭게 정할 수 있습니다.'],

        ['Mit „Markieren“ können Sie Textstellen farbig hervorheben.', '‘Markieren’을 켜고 드래그하면 지문에 형광펜을 칠할 수 있습니다.'],

        ['Schreiben Sie Ihre Texte in das Textfeld. Die Wörter werden automatisch gezählt.', '입력란에 글을 쓰면 단어 수가 자동으로 계산됩니다.'],

        '<p class="note" style="margin-top:8px">Spielt die ersten Sekunden von Teil 1 ab. · 음량 확인용으로 Teil 1 앞부분을 몇 초 들려줍니다.</p></div>';

    window.scrollTo(0, 0);
  }

  /* ---------- volume ---------- */
  function getVol() { var v = lsGet('vol'); return typeof v === 'number' ? v : 0.85; }
  function setVol(v) { v = Math.max(0, Math.min(1, v)); AUD.volume = v; lsSet('vol', v); }

  /* ---------- exam shell ---------- */
  function begin(state, withTour) {
    clearTimeout(probeTimer); probeTimer = null;
    if (R.mod === 'hoeren') { audioAllowPause = true; try { AUD.pause(); } catch (e) { /* ignore */ } audioAllowPause = false; }
    S = state;
    warned = {}; markMode = false;
    if (S.build !== D.build) { S.marks = {}; S.build = D.build; }
    if (typeof S.font !== 'number') S.font = 0;
    if (!(S.page >= 0 && S.page < M.pages.length)) S.page = 0;
    if (S.remaining < 60 * 10) warned[10] = true;
    if (S.remaining < 60 * 5) warned[5] = true;
    renderExam();
    if (withTour) runTour(function () { startClock(); });
    else startClock();
  }

    } else {
      var ed = $('#ed');
      ed.value = S.texts[p.teil] || '';

      $$('#sz button').forEach(function (b) {

  }

  function insertAtCaret(ed, ch) {
    var s = ed.selectionStart, e = ed.selectionEnd, v = ed.value;

    ed.focus();
    ed.dispatchEvent(new Event('input'));
  }
  function updateWC() { var ed = $('#ed'); if (ed) $('#wcn').textContent = wordCount(ed.value); }

  function go(i) {
    if (i < 0 || i >= M.pages.length) return;
    if (i > maxReachable()) { toast('Dieser Teil beginnt erst mit dem nächsten Hörtext.'); return; }
    if (R.mod === 'lesen') saveMarks();
    S.page = i; renderPage(); saveSoon();
  }
  function jumpTo(no) {
    var it = ITEM[no]; if (!it) return;
    if (it.page !== S.page) go(it.page);
    var el = document.getElementById('q-' + no);
    if (el) {
      try { el.scrollIntoView({ block: 'center', behavior: 'smooth' }); } catch (e) { el.scrollIntoView(); }
      el.classList.remove('flash'); void el.offsetWidth; el.classList.add('flash');
      var f = el.querySelector('input:not([disabled]),select:not([disabled])'); if (f) { try { f.focus({ preventScroll: true }); } catch (e2) { /* ignore */ } }
    }
  }

  function setOn(inp) {
    $$('input[name="' + inp.name + '"]').forEach(function (o) {
      var lab = o.closest('label'); if (lab) lab.classList.toggle('on', o.checked);
    });
  }
  function markAnswered(no) {
    var el = document.getElementById('q-' + no);
    if (el) el.classList.toggle('ans', S.answers[no] != null);
  }
  function onAnswer(e) {
    var t = e.target, no = t.getAttribute && t.getAttribute('data-no');

    else if (t.tagName === 'SELECT') { if (t.value) S.answers[no] = t.value; else delete S.answers[no]; }
    markAnswered(no); renderTabs(); renderChips(); saveSoon();
  }

  /* ---------- highlighting (Lesen) ---------- */
  function unwrap(m) { var p = m.parentNode; while (m.firstChild) p.insertBefore(m.firstChild, m); p.removeChild(m); }
  function saveMarks() {
    var pl = $('#pbL'); if (!pl || !S) return;
    var key = M.pages[S.page].key;
    if ($('mark.hl', pl)) {
      var clone = pl.cloneNode(true);
      $$('.inst', clone).forEach(function (n) { n.parentNode.removeChild(n); });
      S.marks[key] = clone.innerHTML;
    } else delete S.marks[key];
  }
  function onMarkUp() {
    if (!markMode || R.mod !== 'lesen') return;
    var pl = $('#pbL'); if (!pl) return;
    var sel = window.getSelection();
    if (!sel || sel.isCollapsed || !sel.rangeCount) return;
    var range = sel.getRangeAt(0);
    if (!pl.contains(range.commonAncestorContainer)) return;
    var rootNode = range.commonAncestorContainer.nodeType === 1 ? range.commonAncestorContainer : range.commonAncestorContainer.parentNode;
    var walker = document.createTreeWalker(rootNode, NodeFilter.SHOW_TEXT, null, false);

    while ((n = walker.nextNode())) { if (range.intersectsNode(n)) nodes.push(n); }

      if (node.parentNode && node.parentNode.closest && (node.parentNode.closest('mark.hl') || node.parentNode.closest('.inst'))) return;
      var start = node === range.startContainer ? range.startOffset : 0;
      var end = node === range.endContainer ? range.endOffset : node.nodeValue.length;
      if (end <= start) return;
      var mid = node;
      if (start > 0) mid = node.splitText(start);
      if (end - start < mid.nodeValue.length) mid.splitText(end - start);

  }

  /* ---------- clock ---------- */
  function startClock() {

  }
  function stopClock() { if (timerId) clearInterval(timerId); timerId = null; }

  /* ---------- audio (Hören) ---------- */
  function startAudioFlow() {

  }
  function curSrc() { return (AUD.getAttribute('src') || '').split('#')[0]; }
  function playTrack(i, pos) {

    ], true);

  AUD.addEventListener('seeking', function () {

  });

      { label: 'Erneut versuchen', pri: true, fn: function () { var i = S.audio.track, p = S.audio.pos; AUD.removeAttribute('src'); playTrack(i, p); } }
    ], true);

  function renderAudioBar() {
    var bar = $('#abar'); if (!bar || !S) return;

  /* ---------- submit / finish ---------- */
  function countOpen() {

  }
  function askSubmit() {

      ko = open ? '아직 쓰지 않은 과제가 ' + open + '개 있습니다. 그래도 제출할까요?' : '지금 제출할까요? 제출하면 더 이상 고칠 수 없습니다.';
    } else {
      de = open ? 'Sie haben noch ' + open + ' offene ' + (open === 1 ? 'Aufgabe' : 'Aufgaben') + '. Möchten Sie das Modul trotzdem abgeben?' : 'Sie haben alle Aufgaben bearbeitet. Möchten Sie das Modul jetzt abgeben?';
      ko = open ? '아직 풀지 않은 문항이 ' + open + '개 있습니다. 그래도 제출할까요?' : '모든 문항을 풀었습니다. 지금 제출할까요?';
      if (R.mod === 'hoeren' && !S.audio.done) { de += ' Der Hörtext wird dann beendet.'; ko += ' 음원 재생도 끝납니다.'; }
    }

  }

  function score() {
    var per = {}, correct = 0, rows = [];
    M.items.forEach(function (it) {
      var g = S.answers[it.no], ok = g != null && g === it.answer;
      if (!per[it.teil]) per[it.teil] = { c: 0, n: 0 };

      rows.push({ no: it.no, teil: it.teil, g: g == null ? null : g, a: it.answer, ok: ok });
    });

  }

  function finish(byTime) {

    showEnd(res);
  }

  function showEnd(res) {
    var ans = M.writing ? [1, 2, 3].filter(function (n) { return String(res.texts[n] || '').trim(); }).length + ' von 3 Aufgaben bearbeitet'
      : Object.keys(res.answers).length + ' von ' + M.items.length + ' Aufgaben beantwortet';

  function runTour(done) {

    }

    var hole = document.createElement('div'); hole.className = 'hole';
    var tip = document.createElement('div'); tip.className = 'tip'; tip.setAttribute('role', 'dialog'); tip.setAttribute('aria-live', 'polite');
    document.body.appendChild(block); document.body.appendChild(hole); document.body.appendChild(tip);
    tourEls = [block, hole, tip];
    function place() {
      var el = $(steps[i][0]); if (!el) return;
      try { el.scrollIntoView({ block: 'nearest' }); } catch (e) { /* ignore */ }
      var r = el.getBoundingClientRect(), pad = 5;
      var vw = window.innerWidth, vh = window.innerHeight;
      var top = Math.max(4, r.top - pad), left = Math.max(4, r.left - pad);
      var w = Math.min(vw - 8, r.width + pad * 2), hh = Math.min(vh - 8, r.height + pad * 2);
      hole.style.top = top + 'px'; hole.style.left = left + 'px'; hole.style.width = w + 'px'; hole.style.height = hh + 'px';
      tip.innerHTML = '<div class="stp">Tutorial · Schritt ' + (i + 1) + ' von ' + steps.length + '</div><p>' + esc(steps[i][1]) + '</p><p class="ko">' + esc(steps[i][2]) + '</p>' +
        '<div class="tb"><button class="btn sm" type="button" id="tskip">Tutorial beenden</button><span style="display:flex;gap:6px">' +
        (i > 0 ? '<button class="btn sm" type="button" id="tprev">Zurück</button>' : '') +
        '<button class="btn sm pri" type="button" id="tnext">' + (i < steps.length - 1 ? 'Weiter' : 'Fertig') + '</button></span></div>';
      var tw = tip.offsetWidth, th = tip.offsetHeight, gap = 14, tx, ty;
      var clampX = function (x) { return Math.min(Math.max(8, x), vw - tw - 8); };
      var clampY = function (y) { return Math.min(Math.max(8, y), vh - th - 8); };
      if (top + hh + gap + th <= vh - 8) { ty = top + hh + gap; tx = clampX(left); }            // below
      else if (top - gap - th >= 8) { ty = top - gap - th; tx = clampX(left); }                // above
      else if (left - gap - tw >= 8) { tx = left - gap - tw; ty = clampY(top + hh / 2 - th / 2); }   // left
      else if (left + w + gap + tw <= vw - 8) { tx = left + w + gap; ty = clampY(top + hh / 2 - th / 2); } // right
      else { tx = clampX(left + w / 2 - tw / 2); ty = clampY(top + hh - th - 16); }              // inside, bottom
      tip.style.top = ty + 'px'; tip.style.left = tx + 'px';
      $('#tnext').addEventListener('click', function () { if (i < steps.length - 1) { i++; place(); } else end(); });
      if ($('#tprev')) $('#tprev').addEventListener('click', function () { i--; place(); });
      $('#tskip').addEventListener('click', end);

  function closeTour() { if (tourEls) { tourEls.forEach(function (e) { if (e.parentNode) e.parentNode.removeChild(e); }); tourEls = null; } }

  /* ---------- go ---------- */
  if (R.view === 'ergebnis') {
    var rr = lsGet(RESULT_KEY);
    if (rr) { showResult(rr); return; }
  }
  showStart();
  window.__exam = {
    model: M, data: T,
    state: function () { return S; },
    seekEnd: function (left) { var t = Math.max(0, (AUD.duration || 0) - (left || 1)); audioLastPos = t; AUD.currentTime = t; }
  };
})();
</script>
